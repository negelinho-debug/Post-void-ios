name: POST VOID iOS v19 DEPTH FIX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build POST VOID iOS v19 IPA
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build v18 base and apply v19 3D depth fix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 -m venv "$RUNNER_TEMP/postvoid-v19-venv"
          source "$RUNNER_TEMP/postvoid-v19-venv/bin/activate"

          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pyyaml

          python <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          import yaml


          WORKFLOW_PATH = ".github/workflows/build-postvoid-ios.yml"

          V16_COMMIT = "61097c8dd98d6b1ef06286209a1ad18087bac362"


          def git_show(commit, path):
              return subprocess.check_output(
                  [
                      "git",
                      "show",
                      f"{commit}:{path}",
                  ],
                  text=True,
              )


          def refresh_github_env():
              env_path = os.environ.get(
                  "GITHUB_ENV"
              )

              if not env_path:
                  return

              path = Path(env_path)

              if not path.exists():
                  return

              for line in path.read_text(
                  errors="ignore"
              ).splitlines():

                  if not line:
                      continue

                  if "=" not in line:
                      continue

                  key, value = line.split(
                      "=",
                      1,
                  )

                  key = key.strip()

                  if key:
                      os.environ[key] = value


          def run_shell_step(name, script):
              print()
              print("=" * 72)
              print("RUNNING:", name)
              print("=" * 72)

              subprocess.run(
                  [
                      "/bin/bash",
                      "-c",
                      script,
                  ],
                  check=True,
                  env=os.environ.copy(),
              )

              refresh_github_env()


          def replace_once(
              text,
              old,
              new,
              label,
          ):
              if old not in text:
                  raise SystemExit(
                      "v19 patch anchor missing: "
                      + label
                  )

              return text.replace(
                  old,
                  new,
                  1,
              )


          def find_v18_workflow():
              commits = subprocess.check_output(
                  [
                      "git",
                      "log",
                      "--format=%H",
                      "--all",
                      "--",
                      WORKFLOW_PATH,
                  ],
                  text=True,
              ).splitlines()

              print(
                  "Searching git history "
                  "for successful v18 workflow..."
              )

              candidates = []

              for commit in commits:
                  try:
                      workflow_text = git_show(
                          commit,
                          WORKFLOW_PATH,
                      )
                  except subprocess.CalledProcessError:
                      continue

                  lower = workflow_text.lower()

                  if (
                      "post void ios v18"
                      not in lower
                  ):
                      continue

                  candidates.append(
                      (
                          commit,
                          workflow_text,
                      )
                  )

              if not candidates:
                  raise SystemExit(
                      "ERROR: No POST VOID v18 "
                      "workflow was found in git history."
                  )

              print(
                  "Found",
                  len(candidates),
                  "v18 workflow candidate(s).",
              )

              for commit, workflow_text in candidates:
                  try:
                      workflow = yaml.safe_load(
                          workflow_text
                      )
                  except Exception as exc:
                      print(
                          "Skipping invalid YAML:",
                          commit,
                          exc,
                      )
                      continue

                  jobs = workflow.get(
                      "jobs",
                      {},
                  )

                  build_job = jobs.get(
                      "build",
                      {},
                  )

                  steps = build_job.get(
                      "steps",
                      [],
                  )

                  for step in steps:
                      script = step.get(
                          "run"
                      )

                      if not script:
                          continue

                      script_lower = (
                          script.lower()
                      )

                      if (
                          "apply_v18_patch()"
                          in script
                          or
                          (
                              "v18"
                              in script_lower
                              and
                              "camera"
                              in script_lower
                              and
                              "work/butterscotch"
                              in script_lower
                          )
                      ):
                          print(
                              "Using v18 workflow commit:",
                              commit,
                          )

                          print(
                              "Using v18 build step:",
                              step.get(
                                  "name",
                                  "<unnamed>",
                              ),
                          )

                          return (
                              workflow,
                              step,
                          )

              print()
              print(
                  "v18 workflows were found, "
                  "but none contained the "
                  "actual v18 build script."
              )

              print(
                  "Candidate commits:"
              )

              for commit, _ in candidates:
                  print(
                      " -",
                      commit,
                  )

              raise SystemExit(
                  "ERROR: Could not identify "
                  "the successful v18 build script."
              )


          def apply_v19_patch():
              print()
              print("=" * 72)
              print(
                  "APPLYING POST VOID v19 "
                  "3D DEPTH / GREEN-SCREEN FIX"
              )
              print("=" * 72)

              root = Path(
                  "work/Butterscotch"
              )

              vm_path = (
                  root /
                  "src/vm_builtins.c"
              )

              gl_common_h_path = (
                  root /
                  "src/gl_common/gl_common.h"
              )

              gl_common_c_path = (
                  root /
                  "src/gl_common/gl_common.c"
              )

              gl_renderer_path = (
                  root /
                  "src/gl/gl_renderer.c"
              )

              main_path = (
                  root /
                  "src/cli/main.c"
              )

              required = [
                  vm_path,
                  gl_common_h_path,
                  gl_common_c_path,
                  gl_renderer_path,
                  main_path,
              ]

              for path in required:
                  if not path.exists():
                      raise SystemExit(
                          "Missing source file: "
                          + str(path)
                      )

              vm = vm_path.read_text()

              gl_common_h = (
                  gl_common_h_path.read_text()
              )

              gl_common_c = (
                  gl_common_c_path.read_text()
              )

              gl_renderer = (
                  gl_renderer_path.read_text()
              )

              main = main_path.read_text()

              # ==============================================
              # 1. RESTORE REAL Z TEST
              # ==============================================

              vm, count = re.subn(
                  r'''(
                      VM_registerBuiltin\(
                          \s*ctx,
                          \s*"gpu_set_ztestenable",
                          \s*
                      )
                      builtin_postvoid_compat_noop
                      (
                          \s*\);
                      )
                  )''',
                  r'''\1builtin_postvoid_gpu_set_ztestenable\2''',
                  vm,
                  count=1,
                  flags=re.X | re.S,
              )

              if count != 1:
                  raise SystemExit(
                      "v19 could not restore "
                      "gpu_set_ztestenable"
                  )

              # ==============================================
              # 2. RESTORE REAL Z WRITE
              # ==============================================

              vm, count = re.subn(
                  r'''(
                      VM_registerBuiltin\(
                          \s*ctx,
                          \s*"gpu_set_zwriteenable",
                          \s*
                      )
                      builtin_postvoid_compat_noop
                      (
                          \s*\);
                      )
                  )''',
                  r'''\1builtin_postvoid_gpu_set_zwriteenable\2''',
                  vm,
                  count=1,
                  flags=re.X | re.S,
              )

              if count != 1:
                  raise SystemExit(
                      "v19 could not restore "
                      "gpu_set_zwriteenable"
                  )

              vm_path.write_text(
                  vm
              )

              # ==============================================
              # 3. ADD DEPTH BUFFER ARRAY TO GL RENDERER
              # ==============================================

              surface_struct_old = '''    GLuint* surfaces;
              GLuint* surfaceTexture;
              int32_t* surfaceWidth;
              int32_t* surfaceHeight;
              uint32_t surfaceCount;'''

              surface_struct_new = '''    GLuint* surfaces;
              GLuint* surfaceTexture;

              // POST VOID v19:
              // depth renderbuffer for each GML surface.
              GLuint* surfaceDepth;

              int32_t* surfaceWidth;
              int32_t* surfaceHeight;
              uint32_t surfaceCount;'''

              gl_common_h = replace_once(
                  gl_common_h,
                  surface_struct_old,
                  surface_struct_new,
                  "GLRenderer surfaceDepth field",
              )

              # ==============================================
              # 4. INITIALIZE DEPTH ARRAY
              # ==============================================

              common_init_old = '''    gl->surfaces = nullptr;
              gl->surfaceTexture = nullptr;
              gl->surfaceWidth = nullptr;
              gl->surfaceHeight = nullptr;
              gl->surfaceCount = 0;'''

              common_init_new = '''    gl->surfaces = nullptr;
              gl->surfaceTexture = nullptr;
              gl->surfaceDepth = nullptr;
              gl->surfaceWidth = nullptr;
              gl->surfaceHeight = nullptr;
              gl->surfaceCount = 0;'''

              gl_common_c = replace_once(
                  gl_common_c,
                  common_init_old,
                  common_init_new,
                  "surfaceDepth initialization",
              )

              # ==============================================
              # 5. DESTROY DEPTH BUFFERS
              # ==============================================

              destroy_old = '''    for (uint32_t i = 0; gl->surfaceCount > i; i++) {
                  if (gl->surfaceTexture[i] != 0) glDeleteTextures(1, &gl->surfaceTexture[i]);
                  if (gl->surfaces[i] != 0) glDeleteFramebuffers(1, &gl->surfaces[i]);
              }'''

              destroy_new = '''    for (uint32_t i = 0; gl->surfaceCount > i; i++) {
                  if (
                      gl->surfaceDepth != nullptr &&
                      gl->surfaceDepth[i] != 0
                  ) {
                      glDeleteRenderbuffers(
                          1,
                          &gl->surfaceDepth[i]
                      );
                  }

                  if (
                      gl->surfaceTexture[i] != 0
                  ) {
                      glDeleteTextures(
                          1,
                          &gl->surfaceTexture[i]
                      );
                  }

                  if (
                      gl->surfaces[i] != 0
                  ) {
                      glDeleteFramebuffers(
                          1,
                          &gl->surfaces[i]
                      );
                  }
              }'''

              gl_common_c = replace_once(
                  gl_common_c,
                  destroy_old,
                  destroy_new,
                  "surface depth destroy",
              )

              # ==============================================
              # 6. FREE DEPTH ARRAY
              # ==============================================

              common_free_old = '''    free(gl->surfaces);
              free(gl->surfaceTexture);
              free(gl->surfaceWidth);
              free(gl->surfaceHeight);'''

              common_free_new = '''    free(gl->surfaces);
              free(gl->surfaceTexture);
              free(gl->surfaceDepth);
              free(gl->surfaceWidth);
              free(gl->surfaceHeight);'''

              gl_common_c = replace_once(
                  gl_common_c,
                  common_free_old,
                  common_free_new,
                  "surfaceDepth free",
              )

              # ==============================================
              # 7. ALLOCATE DEPTH SLOT
              # ==============================================

              alloc_old = '''    uint32_t surfaceIndex = GLCommon_allocateSurfaceSlot(&gl->surfaces, &gl->surfaceTexture, &gl->surfaceWidth, &gl->surfaceHeight, &gl->surfaceCount);

              glGenFramebuffers(1, &gl->surfaces[surfaceIndex]);'''

              alloc_new = '''    uint32_t surfaceIndex = GLCommon_allocateSurfaceSlot(
                  &gl->surfaces,
                  &gl->surfaceTexture,
                  &gl->surfaceWidth,
                  &gl->surfaceHeight,
                  &gl->surfaceCount
              );

              gl->surfaceDepth =
                  (GLuint*)safeRealloc(
                      gl->surfaceDepth,
                      gl->surfaceCount *
                          sizeof(GLuint)
                  );

              gl->surfaceDepth[
                  surfaceIndex
              ] = 0;

              glGenFramebuffers(
                  1,
                  &gl->surfaces[
                      surfaceIndex
                  ]
              );'''

              gl_renderer = replace_once(
                  gl_renderer,
                  alloc_old,
                  alloc_new,
                  "depth slot allocation",
              )

              # ==============================================
              # 8. CREATE DEPTH ATTACHMENT
              # ==============================================

              create_old = '''    glBindFramebuffer(GL_FRAMEBUFFER, gl->surfaces[surfaceIndex]);
              glFramebufferTexture2D(GL_FRAMEBUFFER, GL_COLOR_ATTACHMENT0, GL_TEXTURE_2D, gl->surfaceTexture[surfaceIndex], 0);

              gl->surfaceWidth[surfaceIndex] = width;
              gl->surfaceHeight[surfaceIndex] = height;'''

              create_new = '''    glBindFramebuffer(
                  GL_FRAMEBUFFER,
                  gl->surfaces[
                      surfaceIndex
                  ]
              );

              glFramebufferTexture2D(
                  GL_FRAMEBUFFER,
                  GL_COLOR_ATTACHMENT0,
                  GL_TEXTURE_2D,
                  gl->surfaceTexture[
                      surfaceIndex
                  ],
                  0
              );

              glGenRenderbuffers(
                  1,
                  &gl->surfaceDepth[
                      surfaceIndex
                  ]
              );

              glBindRenderbuffer(
                  GL_RENDERBUFFER,
                  gl->surfaceDepth[
                      surfaceIndex
                  ]
              );

              glRenderbufferStorage(
                  GL_RENDERBUFFER,
                  GL_DEPTH_COMPONENT24,
                  width,
                  height
              );

              glFramebufferRenderbuffer(
                  GL_FRAMEBUFFER,
                  GL_DEPTH_ATTACHMENT,
                  GL_RENDERBUFFER,
                  gl->surfaceDepth[
                      surfaceIndex
                  ]
              );

              GLenum postVoidStatus =
                  glCheckFramebufferStatus(
                      GL_FRAMEBUFFER
                  );

              if (
                  postVoidStatus !=
                  GL_FRAMEBUFFER_COMPLETE
              ) {
                  logWarn(
                      "POST VOID v19: "
                      "surface %u framebuffer "
                      "status 0x%X\\n",
                      surfaceIndex,
                      (unsigned)
                          postVoidStatus
                  );
              }
              else {
                  logInfo(
                      "POST VOID v19: "
                      "depth buffer attached "
                      "to surface %u (%dx%d)\\n",
                      surfaceIndex,
                      width,
                      height
                  );
              }

              glBindRenderbuffer(
                  GL_RENDERBUFFER,
                  0
              );

              gl->surfaceWidth[
                  surfaceIndex
              ] = width;

              gl->surfaceHeight[
                  surfaceIndex
              ] = height;'''

              gl_renderer = replace_once(
                  gl_renderer,
                  create_old,
                  create_new,
                  "surface depth attachment",
              )

              # ==============================================
              # 9. FREE DEPTH WITH SURFACE
              # ==============================================

              surface_free_old = '''    if (gl->surfaceTexture[surfaceID] != 0) glDeleteTextures(1, &gl->surfaceTexture[surfaceID]);
              if (gl->surfaces[surfaceID] != 0) glDeleteFramebuffers(1, &gl->surfaces[surfaceID]);
              gl->surfaces[surfaceID] = 0;
              gl->surfaceTexture[surfaceID] = 0;
              gl->surfaceWidth[surfaceID] = 0;
              gl->surfaceHeight[surfaceID] = 0;'''

              surface_free_new = '''    if (
                  gl->surfaceDepth != nullptr &&
                  gl->surfaceDepth[
                      surfaceID
                  ] != 0
              ) {
                  glDeleteRenderbuffers(
                      1,
                      &gl->surfaceDepth[
                          surfaceID
                      ]
                  );

                  gl->surfaceDepth[
                      surfaceID
                  ] = 0;
              }

              if (
                  gl->surfaceTexture[
                      surfaceID
                  ] != 0
              ) {
                  glDeleteTextures(
                      1,
                      &gl->surfaceTexture[
                          surfaceID
                      ]
                  );
              }

              if (
                  gl->surfaces[
                      surfaceID
                  ] != 0
              ) {
                  glDeleteFramebuffers(
                      1,
                      &gl->surfaces[
                          surfaceID
                      ]
                  );
              }

              gl->surfaces[
                  surfaceID
              ] = 0;

              gl->surfaceTexture[
                  surfaceID
              ] = 0;

              gl->surfaceWidth[
                  surfaceID
              ] = 0;

              gl->surfaceHeight[
                  surfaceID
              ] = 0;'''

              gl_renderer = replace_once(
                  gl_renderer,
                  surface_free_old,
                  surface_free_new,
                  "surface depth free",
              )

              # ==============================================
              # 10. RECREATE DEPTH ON SURFACE RESIZE
              # ==============================================

              resize_old = '''    glBindFramebuffer(GL_FRAMEBUFFER, gl->surfaces[surfaceID]);
              glFramebufferTexture2D(GL_FRAMEBUFFER, GL_COLOR_ATTACHMENT0, GL_TEXTURE_2D, gl->surfaceTexture[surfaceID], 0);

              gl->surfaceWidth[surfaceID] = width;
              gl->surfaceHeight[surfaceID] = height;'''

              resize_new = '''    glBindFramebuffer(
                  GL_FRAMEBUFFER,
                  gl->surfaces[
                      surfaceID
                  ]
              );

              glFramebufferTexture2D(
                  GL_FRAMEBUFFER,
                  GL_COLOR_ATTACHMENT0,
                  GL_TEXTURE_2D,
                  gl->surfaceTexture[
                      surfaceID
                  ],
                  0
              );

              if (
                  gl->surfaceDepth != nullptr &&
                  gl->surfaceDepth[
                      surfaceID
                  ] != 0
              ) {
                  glDeleteRenderbuffers(
                      1,
                      &gl->surfaceDepth[
                          surfaceID
                      ]
                  );

                  gl->surfaceDepth[
                      surfaceID
                  ] = 0;
              }

              glGenRenderbuffers(
                  1,
                  &gl->surfaceDepth[
                      surfaceID
                  ]
              );

              glBindRenderbuffer(
                  GL_RENDERBUFFER,
                  gl->surfaceDepth[
                      surfaceID
                  ]
              );

              glRenderbufferStorage(
                  GL_RENDERBUFFER,
                  GL_DEPTH_COMPONENT24,
                  width,
                  height
              );

              glFramebufferRenderbuffer(
                  GL_FRAMEBUFFER,
                  GL_DEPTH_ATTACHMENT,
                  GL_RENDERBUFFER,
                  gl->surfaceDepth[
                      surfaceID
                  ]
              );

              GLenum postVoidResizeStatus =
                  glCheckFramebufferStatus(
                      GL_FRAMEBUFFER
                  );

              if (
                  postVoidResizeStatus !=
                  GL_FRAMEBUFFER_COMPLETE
              ) {
                  logWarn(
                      "POST VOID v19: "
                      "resized surface %d "
                      "framebuffer status 0x%X\\n",
                      surfaceID,
                      (unsigned)
                          postVoidResizeStatus
                  );
              }

              glBindRenderbuffer(
                  GL_RENDERBUFFER,
                  0
              );

              gl->surfaceWidth[
                  surfaceID
              ] = width;

              gl->surfaceHeight[
                  surfaceID
              ] = height;'''

              gl_renderer = replace_once(
                  gl_renderer,
                  resize_old,
                  resize_new,
                  "resize depth attachment",
              )

              # ==============================================
              # 11. CLEAR BOTH COLOR AND DEPTH
              # ==============================================

              clear_old = '''    glClearColor(r, g, b, alpha);
              glClear(GL_COLOR_BUFFER_BIT);
          }'''

              clear_new = '''    glClearColor(
                  r,
                  g,
                  b,
                  alpha
              );

              GLboolean postVoidOldDepthMask =
                  GL_TRUE;

              glGetBooleanv(
                  GL_DEPTH_WRITEMASK,
                  &postVoidOldDepthMask
              );

              glDepthMask(
                  GL_TRUE
              );

              glClearDepthf(
                  1.0f
              );

              glClear(
                  GL_COLOR_BUFFER_BIT |
                  GL_DEPTH_BUFFER_BIT
              );

              glDepthMask(
                  postVoidOldDepthMask
              );
          }'''

              gl_renderer = replace_once(
                  gl_renderer,
                  clear_old,
                  clear_new,
                  "depth clear",
              )

              # ==============================================
              # 12. FRESH SAVE DIRECTORY
              # ==============================================

              if (
                  "Documents/PostVoidV18"
                  in main
              ):
                  main = main.replace(
                      "Documents/PostVoidV18",
                      "Documents/PostVoidV19",
                  )

              gl_common_h_path.write_text(
                  gl_common_h
              )

              gl_common_c_path.write_text(
                  gl_common_c
              )

              gl_renderer_path.write_text(
                  gl_renderer
              )

              main_path.write_text(
                  main
              )

              print()
              print(
                  "POST VOID v19 depth "
                  "patch complete"
              )


          # ==============================================
          # GET THE REAL WORKING v18 BUILD
          # ==============================================

          (
              v18_workflow,
              v18_step,
          ) = find_v18_workflow()

          v18_run_script = (
              v18_step.get(
                  "run"
              )
          )

          if not v18_run_script:
              raise SystemExit(
                  "ERROR: v18 build script "
                  "is empty."
              )

          run_shell_step(
              "Successful POST VOID v18 base",
              v18_run_script,
          )

          refresh_github_env()

          # ==============================================
          # PATCH THE PREPARED V18 SOURCE
          # ==============================================

          apply_v19_patch()

          # ==============================================
          # LOAD KNOWN-GOOD BUILD/PACKAGE STEPS
          # ==============================================

          print()
          print("=" * 72)
          print(
              "REBUILDING POST VOID v19"
          )
          print("=" * 72)

          v16_workflow = yaml.safe_load(
              git_show(
                  V16_COMMIT,
                  WORKFLOW_PATH,
              )
          )

          v16_steps = (
              v16_workflow[
                  "jobs"
              ][
                  "build"
              ][
                  "steps"
              ]
          )

          started = False

          for step in v16_steps:
              name = step.get(
                  "name",
                  "<unnamed>",
              )

              if (
                  name ==
                  "Configure ARM64 iOS runner"
              ):
                  started = True

              if not started:
                  continue

              if "run" not in step:
                  continue

              run_shell_step(
                  name,
                  step["run"],
              )

          # ==============================================
          # FIND PRODUCED IPA
          # ==============================================

          expected_ipa = Path(
              "out/"
              "POST-VOID-iOS-v16-"
              "WINDOWS-INPUTFIX-unsigned.ipa"
          )

          if not expected_ipa.exists():
              ipa_files = list(
                  Path("out").glob(
                      "*.ipa"
                  )
              )

              ipa_files = [
                  p
                  for p in ipa_files
                  if "v19" not in p.name.lower()
              ]

              if not ipa_files:
                  raise SystemExit(
                      "ERROR: rebuild completed "
                      "but no IPA was produced."
                  )

              expected_ipa = max(
                  ipa_files,
                  key=lambda p:
                      p.stat().st_mtime,
              )

              print(
                  "Using produced IPA:",
                  expected_ipa,
              )

          output_ipa = Path(
              "out/"
              "POST-VOID-iOS-v19-"
              "DEPTH-GREENSCREEN-FIX-"
              "unsigned.ipa"
          )

          if output_ipa.exists():
              output_ipa.unlink()

          expected_ipa.rename(
              output_ipa
          )

          print()
          print("=" * 72)
          print(
              "POST VOID v19 IPA READY"
          )
          print("=" * 72)

          print(
              output_ipa
          )

          print(
              f"{output_ipa.stat().st_size / 1024 / 1024:.1f} MB"
          )
          PY

      - name: Upload POST VOID v19 IPA
        uses: actions/upload-artifact@v4
        with:
          name: POST-VOID-iOS-v19-DEPTH-GREENSCREEN-FIX
          path: out/POST-VOID-iOS-v19-DEPTH-GREENSCREEN-FIX-unsigned.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Upload POST VOID v19 build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POST-VOID-iOS-v19-build-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
