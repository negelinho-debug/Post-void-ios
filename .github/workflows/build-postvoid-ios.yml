      - name: v17 GameMaker 3D menu fix
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          vm = Path(
              "work/Butterscotch/src/vm_builtins.c"
          )

          s = vm.read_text()

          include_anchor = (
              '#include "math_compat.h"\n'
          )

          include_repl = '''#include "math_compat.h"
          #ifdef PLATFORM_IOS
          #include <OpenGLES/ES3/gl.h>
          #endif
          '''

          if include_anchor not in s:
              raise SystemExit(
                  "v17 include anchor missing"
              )

          s = s.replace(
              include_anchor,
              include_repl,
              1
          )

          matrix_anchor = '''static RValue builtin_matrix_build_identity(MAYBE_UNUSED VMContext *ctx, MAYBE_UNUSED RValue *args, MAYBE_UNUSED int32_t argCount) {
              Matrix4f id;
              return RValue_makeArray(matrixToGml(ctx->dataWin, Matrix4f_identity(&id)));
          }'''

          matrix_repl = r'''static RValue builtin_matrix_build(
              VMContext *ctx,
              RValue *args,
              int32_t argCount
          ) {
              REQUIRE_ARGC_AT_LEAST(
                  "matrix_build",
                  9,
                  RValue_makeUndefined()
              );

              REQUIRE_ARGC_AT_MOST(
                  "matrix_build",
                  10,
                  RValue_makeUndefined()
              );

              GMLReal x =
                  RValue_toReal(args[0]);

              GMLReal y =
                  RValue_toReal(args[1]);

              GMLReal z =
                  RValue_toReal(args[2]);

              GMLReal xr =
                  -RValue_toReal(args[3]) *
                  (
                      (GMLReal)M_PI /
                      (GMLReal)180.0
                  );

              GMLReal yr =
                  -RValue_toReal(args[4]) *
                  (
                      (GMLReal)M_PI /
                      (GMLReal)180.0
                  );

              GMLReal zr =
                  -RValue_toReal(args[5]) *
                  (
                      (GMLReal)M_PI /
                      (GMLReal)180.0
                  );

              GMLReal sx =
                  RValue_toReal(args[6]);

              GMLReal sy =
                  RValue_toReal(args[7]);

              GMLReal sz =
                  RValue_toReal(args[8]);

              GMLReal sinp =
                  GMLReal_sin(xr);

              GMLReal cosp =
                  GMLReal_cos(xr);

              GMLReal sinh =
                  GMLReal_sin(yr);

              GMLReal cosh =
                  GMLReal_cos(yr);

              GMLReal sinr =
                  GMLReal_sin(zr);

              GMLReal cosr =
                  GMLReal_cos(zr);

              GMLReal sinrsinp =
                  -sinr * -sinp;

              GMLReal cosrsinp =
                  cosr * -sinp;

              Matrix4f m;

              m.m[0] =
                  (
                      (cosr * cosh) +
                      (
                          sinrsinp *
                          -sinh
                      )
                  ) *
                  sx;

              m.m[4] =
                  (
                      -sinr *
                      cosp
                  ) *
                  sx;

              m.m[8] =
                  (
                      (cosr * sinh) +
                      (
                          sinrsinp *
                          cosh
                      )
                  ) *
                  sx;

              m.m[12] =
                  x;

              m.m[1] =
                  (
                      (sinr * cosh) +
                      (
                          cosrsinp *
                          -sinh
                      )
                  ) *
                  sy;

              m.m[5] =
                  (
                      cosr *
                      cosp
                  ) *
                  sy;

              m.m[9] =
                  (
                      (sinr * sinh) +
                      (
                          cosrsinp *
                          cosh
                      )
                  ) *
                  sy;

              m.m[13] =
                  y;

              m.m[2] =
                  (
                      cosp *
                      -sinh
                  ) *
                  sz;

              m.m[6] =
                  sinp *
                  sz;

              m.m[10] =
                  (
                      cosp *
                      cosh
                  ) *
                  sz;

              m.m[14] =
                  z;

              m.m[3] =
                  0.0f;

              m.m[7] =
                  0.0f;

              m.m[11] =
                  0.0f;

              m.m[15] =
                  1.0f;

              if (
                  argCount >= 10 &&
                  rvalueIsMatrix(
                      args[9]
                  )
              ) {
                  GMLArray *dest =
                      args[9].array;

                  repeat(
                      16,
                      i
                  ) {
                      *GMLArray_slot(
                          dest,
                          i
                      ) =
                          RValue_makeReal(
                              m.m[i]
                          );
                  }

                  return
                      RValue_makeArrayWeak(
                          dest
                      );
              }

              return
                  RValue_makeArray(
                      matrixToGml(
                          ctx->dataWin,
                          &m
                      )
                  );
          }

          static RValue builtin_postvoid_gpu_set_ztestenable(
              MAYBE_UNUSED VMContext *ctx,
              RValue *args,
              int32_t argCount
          ) {
              if (argCount < 1)
                  return
                      RValue_makeUndefined();

          #ifdef PLATFORM_IOS
              if (
                  RValue_toBool(
                      args[0]
                  )
              ) {
                  glEnable(
                      GL_DEPTH_TEST
                  );

                  glDepthFunc(
                      GL_LEQUAL
                  );
              }
              else {
                  glDisable(
                      GL_DEPTH_TEST
                  );
              }
          #endif

              return
                  RValue_makeUndefined();
          }

          static RValue builtin_postvoid_gpu_set_zwriteenable(
              MAYBE_UNUSED VMContext *ctx,
              RValue *args,
              int32_t argCount
          ) {
              if (argCount < 1)
                  return
                      RValue_makeUndefined();

          #ifdef PLATFORM_IOS
              glDepthMask(
                  RValue_toBool(
                      args[0]
                  )
                      ? GL_TRUE
                      : GL_FALSE
              );
          #endif

              return
                  RValue_makeUndefined();
          }

          static RValue builtin_postvoid_compat_noop(
              MAYBE_UNUSED VMContext *ctx,
              MAYBE_UNUSED RValue *args,
              MAYBE_UNUSED int32_t argCount
          ) {
              return
                  RValue_makeUndefined();
          }

          static RValue builtin_matrix_build_identity(
              MAYBE_UNUSED VMContext *ctx,
              MAYBE_UNUSED RValue *args,
              MAYBE_UNUSED int32_t argCount
          ) {
              Matrix4f id;

              return
                  RValue_makeArray(
                      matrixToGml(
                          ctx->dataWin,
                          Matrix4f_identity(
                              &id
                          )
                      )
                  );
          }'''

          if matrix_anchor not in s:
              raise SystemExit(
                  "v17 matrix anchor missing"
              )

          s = s.replace(
              matrix_anchor,
              matrix_repl,
              1
          )

          reg_anchor = '''    VM_registerBuiltin(ctx, "matrix_build_identity", builtin_matrix_build_identity);'''

          reg_repl = '''    VM_registerBuiltin(ctx, "matrix_build", builtin_matrix_build);
              VM_registerBuiltin(ctx, "matrix_build_identity", builtin_matrix_build_identity);
              VM_registerBuiltin(ctx, "gpu_set_ztestenable", builtin_postvoid_gpu_set_ztestenable);
              VM_registerBuiltin(ctx, "gpu_set_zwriteenable", builtin_postvoid_gpu_set_zwriteenable);
              VM_registerBuiltin(ctx, "gpu_set_texfilter", builtin_postvoid_compat_noop);
              VM_registerBuiltin(ctx, "sprite_prefetch", builtin_postvoid_compat_noop);
              VM_registerBuiltin(ctx, "camera_set_update_script", builtin_postvoid_compat_noop);
              VM_registerBuiltin(ctx, "display_reset", builtin_postvoid_compat_noop);
              VM_registerBuiltin(ctx, "buffer_async_group_option", builtin_postvoid_compat_noop);'''

          if reg_anchor not in s:
              raise SystemExit(
                  "v17 registration anchor missing"
              )

          s = s.replace(
              reg_anchor,
              reg_repl,
              1
          )

          vm.write_text(s)

          print(
              "POST VOID v17 "
              "matrix/menu patch applied"
          )
          PY

      - name: Configure ARM64 iOS runner
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work/build

          cmake \
            -S work/Butterscotch \
            -B work/build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DPLATFORM=cli \
            -DBACKEND=sdl2 \
            -DAUDIO_BACKEND=none \
            -DENABLE_WAD14=ON \
            -DENABLE_WAD16=ON \
            -DENABLE_WAD17=ON \
            -DENABLE_LEGACY_GL=OFF \
            -DENABLE_MODERN_GL=ON \
            -DENABLE_VM_GML_PROFILER=OFF \
            -DENABLE_VM_TRACING=OFF \
            -DENABLE_VM_OPCODE_PROFILER=OFF \
            -DENABLE_VM_STUB_LOGS=ON \
            -DENABLE_ASAN=OFF \
            2>&1 |
            tee logs/configure.log

      - name: Compile ARM64 iOS runner
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build work/build \
            --config Release \
            --target butterscotch \
            2>&1 |
            tee logs/build.log

          APP="$(
            find work/build \
              -type d \
              -name 'PostVoid.app' \
              | head -n 1
          )"

          if [
            -z "$APP"
          ] || [
            ! -d "$APP"
          ]; then
            echo \
              "ERROR: PostVoid.app was not produced."

            find work/build \
              -maxdepth 6 \
              -type f \
              | sort \
              | tail -300

            exit 1
          fi

          echo \
            "APP=$APP" \
            >> "$GITHUB_ENV"

          echo \
            "Built app: $APP"

          ls -la "$APP"

          test \
            -f "$APP/PostVoid"

          file \
            "$APP/PostVoid"

          lipo \
            -info "$APP/PostVoid" \
            || true

      - name: Add complete POST VOID game data
        shell: bash
        run: |
          set -euo pipefail

          cp -R \
            work/game/. \
            "$APP/"

          cp \
            work/ui/Icon-60@2x.png \
            "$APP/Icon-60@2x.png"

          cp \
            work/ui/Icon-60@3x.png \
            "$APP/Icon-60@3x.png"

          cp \
            work/ui/PV_pause.png \
            "$APP/PV_pause.png"

          cp \
            work/ui/PV_fire.png \
            "$APP/PV_fire.png"

          cp \
            work/ui/PV_jump.png \
            "$APP/PV_jump.png"

          cp \
            work/ui/PV_extra.png \
            "$APP/PV_extra.png"

          test \
            -f "$APP/game.droid"

          test \
            -f "$APP/options.ini"

          test \
            -f "$APP/localization.json"

          test \
            -f "$APP/gamecontrollerdb.txt"

          echo \
            "Final app contents:"

          du -sh "$APP"

          ls -lh \
            "$APP/game.droid"

      - name: Ad-hoc sign
        shell: bash
        run: |
          set -euo pipefail

          xattr \
            -cr "$APP" \
            || true

          codesign \
            --force \
            --sign - \
            --timestamp=none \
            "$APP"

          codesign \
            -vv \
            "$APP"

      - name: Build IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            work/Payload

          mkdir -p \
            work/Payload

          cp -R \
            "$APP" \
            work/Payload/PostVoid.app

          rm -f \
            out/POST-VOID-iOS-v17-MATRIX-MENUFIX-unsigned.ipa

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            work/Payload \
            out/POST-VOID-iOS-v17-MATRIX-MENUFIX-unsigned.ipa

          test \
            -s out/POST-VOID-iOS-v17-MATRIX-MENUFIX-unsigned.ipa

          echo \
            "IPA ready:"

          ls -lh \
            out/POST-VOID-iOS-v17-MATRIX-MENUFIX-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: POST-VOID-iOS-v17-MATRIX-MENUFIX
          path: out/POST-VOID-iOS-v17-MATRIX-MENUFIX-unsigned.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POST-VOID-iOS-build-logs
          path: logs/
          if-no-files-found: ignore
