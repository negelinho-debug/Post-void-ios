name: POST VOID iOS Port

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build POST VOID iOS IPA
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          set -e
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          clang --version

      - name: Prepare folders
        run: |
          set -e
          mkdir -p input work logs out

      - name: Download full POST VOID APK from Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching Releases for an APK..."

          TAG=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue

            if gh release view "$tag" \
              --json assets \
              --jq '.assets[].name' \
              | grep -Eiq '\.apk$'; then
              TAG="$tag"
              break
            fi
          done < <(
            gh release list \
              --limit 50 \
              --json tagName \
              --jq '.[].tagName'
          )

          if [ -z "$TAG" ]; then
            echo "ERROR: No Release containing an APK was found."
            exit 1
          fi

          echo "Using Release: $TAG"

          rm -rf input/apks
          mkdir -p input/apks

          gh release download "$TAG" \
            --pattern "*.apk" \
            --dir input/apks \
            --clobber

          APK="$(python3 - <<'PY'
          from pathlib import Path
          files = list(Path('input/apks').glob('*.apk'))
          if not files:
              raise SystemExit(1)
          print(max(files, key=lambda p: p.stat().st_size))
          PY
          )"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK download failed."
            exit 1
          fi

          SIZE="$(stat -f%z "$APK")"
          echo "APK: $APK"
          ls -lh "$APK"

          if [ "$SIZE" -lt 100000000 ]; then
            echo "ERROR: The APK is smaller than 100 MB."
            echo "It looks like the BYOD build, not the full POST VOID package."
            exit 1
          fi

          echo "APK=$GITHUB_WORKSPACE/$APK" >> "$GITHUB_ENV"

      - name: Extract Android port
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work/apk work/game_data work/game
          rm -f work/data0.zip work/game_data.apk

          unzip -p "$APK" assets/data0 > work/data0.zip
          test -s work/data0.zip

          echo "POST VOID data0 extracted:"
          ls -lh work/data0.zip

      - name: Find embedded game data
        shell: bash
        run: |
          set -euo pipefail

          unzip -p work/data0.zip \
            files/game_data.apk \
            > work/game_data.apk

          test -s work/game_data.apk

          rm -rf work/game_data
          mkdir -p work/game_data

          unzip -oq work/game_data.apk \
            -d work/game_data

          test -f work/game_data/assets/game.droid

          rm -rf work/game
          mkdir -p work/game
          cp -R work/game_data/assets/. work/game/

          python3 - <<'PY'
          from pathlib import Path

          p = Path('work/game/game.droid')
          data = p.read_bytes()[:4]
          print('game.droid header:', data)

          if data != b'FORM':
              raise SystemExit(
                  'ERROR: game.droid is not a valid GameMaker data package'
              )
          PY

          echo "Embedded full game data found:"
          du -sh work/game
          ls -lh work/game/game.droid

      - name: Install original Android companion assets
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            localization.json \
            localization_ar_test.json \
            options.ini \
            gamecontrollerdb.txt
          do
            if unzip -l "$APK" "assets/$name" >/dev/null 2>&1; then
              unzip -p "$APK" \
                "assets/$name" \
                > "work/game/$name"

              test -s "work/game/$name"
              echo "Installed outer APK asset: $name"
            else
              echo "Outer APK asset not found: $name"
            fi
          done

          rm -rf work/outer_assets
          mkdir -p work/outer_assets

          if unzip -l "$APK" 'assets/fonts/*' \
            | grep -q 'assets/fonts/'; then

            unzip -oq "$APK" \
              'assets/fonts/*' \
              -d work/outer_assets

            if [ -d work/outer_assets/assets/fonts ]; then
              rm -rf work/game/fonts
              cp -R \
                work/outer_assets/assets/fonts \
                work/game/fonts
            fi
          fi

      - name: Patch POST VOID localization for iOS
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("work/game/localization.json"),
              Path("work/game/localization_ar_test.json"),
          ]

          if not files[0].exists():
              raise SystemExit(
                  "ERROR: localization.json missing"
              )

          defaults = {
              "ControllerDisconnected":
                  "CONTROLLER DISCONNECTED",
              "PressToContinue":
                  "press {Select} to continue",
          }

          for path in files:
              if not path.exists():
                  continue

              data = json.loads(
                  path.read_text(
                      encoding="utf-8-sig"
                  )
              )

              for language, table in data.items():
                  if not isinstance(table, dict):
                      continue

                  for key, value in defaults.items():
                      if key not in table:
                          table[key] = value

              path.write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )
          PY

      - name: Extract original POST VOID icon and buttons
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/ui

          unzip -p "$APK" 'res/o-.png' \
            > work/ui/IconSource.png

          unzip -p "$APK" 'res/2_.png' \
            > work/ui/PV_pause.png

          unzip -p "$APK" 'res/t3.png' \
            > work/ui/PV_fire.png

          unzip -p "$APK" 'res/UF.png' \
            > work/ui/PV_jump.png

          unzip -p "$APK" 'res/5J.png' \
            > work/ui/PV_extra.png

          test -s work/ui/IconSource.png
          test -s work/ui/PV_pause.png
          test -s work/ui/PV_fire.png
          test -s work/ui/PV_jump.png
          test -s work/ui/PV_extra.png

          sips -z 180 180 \
            work/ui/IconSource.png \
            --out work/ui/Icon-60@3x.png \
            >/dev/null

          sips -z 120 120 \
            work/ui/IconSource.png \
            --out work/ui/Icon-60@2x.png \
            >/dev/null

      - name: Get Butterscotch GameMaker runner
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work/Butterscotch

          git clone \
            https://github.com/ButterscotchRunner/Butterscotch.git \
            work/Butterscotch

          git -C work/Butterscotch \
            checkout \
            d05526846e75449295ed2596bd86e9db0108408a

          git -C work/Butterscotch \
            submodule update \
            --init \
            --recursive

          rm -rf \
            work/Butterscotch/vendor/SDL2

          git clone \
            --depth 1 \
            --branch release-2.32.10 \
            https://github.com/libsdl-org/SDL.git \
            work/Butterscotch/vendor/SDL2

      - name: Create iOS runner project
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import textwrap

          root = Path(
              "work/Butterscotch"
          )

          def replace(
              path,
              old,
              new,
              count=1
          ):
              p = root / path
              s = p.read_text()

              if old not in s:
                  raise SystemExit(
                      f"Patch anchor missing in {path}: "
                      f"{old[:100]!r}"
                  )

              p.write_text(
                  s.replace(
                      old,
                      new,
                      count
                  )
              )

          replace(
              "CMakeLists.txt",
              "project(butterscotch C)",
              '''if(CMAKE_SYSTEM_NAME STREQUAL "iOS")
          project(butterscotch C OBJC)
          else()
          project(butterscotch C)
          endif()'''
          )

          for rel in [
              "src/gl_common/gl_common.h",
              "src/gl/gl_renderer.h",
              "src/gl/gl_renderer.c",
          ]:
              replace(
                  rel,
                  '#if defined(__EMSCRIPTEN__) || defined(__ANDROID__) || defined(__SWITCH__)\n#include <GLES3/gl3.h>',
                  '#if defined(PLATFORM_IOS)\n#include <OpenGLES/ES3/gl.h>\n#elif defined(__EMSCRIPTEN__) || defined(__ANDROID__) || defined(__SWITCH__)\n#include <GLES3/gl3.h>'
              )

          replace(
              "src/gl/gl_renderer.c",
              '#if !defined(__EMSCRIPTEN__) && !defined(__ANDROID__) && !defined(__VITA__) && !defined(__SWITCH__)',
              '#if !defined(__EMSCRIPTEN__) && !defined(__ANDROID__) && !defined(__VITA__) && !defined(__SWITCH__) && !defined(PLATFORM_IOS)',
              count=2
          )

          replace(
              "src/loop.c",
              '!defined(__EMSCRIPTEN__) && !defined(__ANDROID__) && !defined(PLATFORM_PS3) && !defined(PLATFORM_VITA) && !defined(__SWITCH__)',
              '!defined(__EMSCRIPTEN__) && !defined(__ANDROID__) && !defined(PLATFORM_IOS) && !defined(PLATFORM_PS3) && !defined(PLATFORM_VITA) && !defined(__SWITCH__)'
          )

          replace(
              "src/gl_common/gl_wrappers.h",
              '#if !defined(_BS_GL_WRAPPERS_H_) && !defined(__EMSCRIPTEN__) && !defined(PLATFORM_PS3) && !defined(PLATFORM_VITA) && !defined(__ANDROID__) && !defined(__SWITCH__)',
              '#if !defined(_BS_GL_WRAPPERS_H_) && !defined(__EMSCRIPTEN__) && !defined(PLATFORM_PS3) && !defined(PLATFORM_VITA) && !defined(__ANDROID__) && !defined(__SWITCH__) && !defined(PLATFORM_IOS)'
          )

          replace(
              "src/gl_common/gl_common.c",
              '#if !defined(__EMSCRIPTEN__) && !defined(__ANDROID__) && !defined(PLATFORM_VITA) && !defined(__SWITCH__) && !defined(PLATFORM_PS3)',
              '#if !defined(__EMSCRIPTEN__) && !defined(__ANDROID__) && !defined(PLATFORM_VITA) && !defined(__SWITCH__) && !defined(PLATFORM_PS3) && !defined(PLATFORM_IOS)'
          )

          replace(
              "src/vm_builtins.c",
              'VM_registerBuiltin(ctx, "vertex_format_add_textcoord", builtin_vertex_format_add_textcoord);',
              '''VM_registerBuiltin(ctx, "vertex_format_add_textcoord", builtin_vertex_format_add_textcoord);
              VM_registerBuiltin(ctx, "vertex_format_add_texcoord", builtin_vertex_format_add_textcoord);'''
          )

          replace(
              "src/vm_builtins.c",
              "// ===[ STUB LOGGING ]===",
              '''static RValue builtin_font_add_enable_aa(
                  MAYBE_UNUSED VMContext* ctx,
                  MAYBE_UNUSED RValue* args,
                  MAYBE_UNUSED int32_t argCount
              ) {
                  return RValue_makeUndefined();
              }

              // ===[ STUB LOGGING ]==='''
          )

          replace(
              "src/vm_builtins.c",
              'VM_registerBuiltin(ctx, "font_add_sprite", builtin_font_add_sprite);',
              '''VM_registerBuiltin(ctx, "font_add_enable_aa", builtin_font_add_enable_aa);
              VM_registerBuiltin(ctx, "font_add_sprite", builtin_font_add_sprite);'''
          )

          gl_shader_anchor = '''        char* patchedVertexSource = nullptr;
                  char* patchedFragmentSource = nullptr;
          '''

          gl_shader_replacement = '''        char* patchedVertexSource = nullptr;
                  char* patchedFragmentSource = nullptr;

          #ifdef PLATFORM_IOS
                  if (
                      modernGl->isGLES &&
                      fragmentShaderSource != nullptr &&
                      strncmp(
                          fragmentShaderSource,
                          "#version 100\\\\n",
                          13
                      ) == 0 &&
                      strstr(
                          fragmentShaderSource,
                          "fwidth"
                      ) != nullptr
                  ) {
                      const char* versionLine =
                          "#version 100\\\\n";

                      const char* extensionLine =
                          "#extension GL_OES_standard_derivatives : enable\\\\n";

                      size_t srcLen =
                          strlen(fragmentShaderSource);

                      size_t versionLen =
                          strlen(versionLine);

                      size_t extensionLen =
                          strlen(extensionLine);

                      patchedFragmentSource =
                          (char*)safeMalloc(
                              srcLen +
                              extensionLen +
                              1
                          );

                      memcpy(
                          patchedFragmentSource,
                          versionLine,
                          versionLen
                      );

                      memcpy(
                          patchedFragmentSource +
                          versionLen,
                          extensionLine,
                          extensionLen
                      );

                      memcpy(
                          patchedFragmentSource +
                          versionLen +
                          extensionLen,
                          fragmentShaderSource +
                          versionLen,
                          srcLen -
                          versionLen +
                          1
                      );

                      fragmentShaderSource =
                          patchedFragmentSource;
                  }
          #endif
          '''

          replace(
              "src/gl/gl_renderer.c",
              gl_shader_anchor,
              gl_shader_replacement
          )

          sdf_compile_anchor = '''        compileProgram(
                      gmlShader,
                      shdr->name,
                      vertexShaderSource,
                      fragmentShaderSource,
                      shdr->vertexAttributeCount,
                      shdr->vertexAttributes
                  );'''

          sdf_compile_replacement = r'''#ifdef PLATFORM_IOS
                  if (
                      modernGl->isGLES &&
                      strcmp(
                          shdr->name,
                          "__yy_sdf_shader"
                      ) == 0
                  ) {
                      fragmentShaderSource =
                          "#version 100\n"
                          "precision mediump float;\n"
                          "varying vec2 v_vTexcoord;\n"
                          "varying vec4 v_vColour;\n"
                          "uniform sampler2D gm_BaseTexture;\n"
                          "void main() {\n"
                          "    vec4 texcol = texture2D(gm_BaseTexture, v_vTexcoord);\n"
                          "    float spread = 0.0035;\n"
                          "    float alpha = smoothstep(0.5 - spread, 0.5 + spread, texcol.a);\n"
                          "    gl_FragColor = vec4(v_vColour.rgb, alpha * v_vColour.a);\n"
                          "}\n";
                  }
          #endif

                  compileProgram(
                      gmlShader,
                      shdr->name,
                      vertexShaderSource,
                      fragmentShaderSource,
                      shdr->vertexAttributeCount,
                      shdr->vertexAttributes
                  );'''

          replace(
              "src/gl/gl_renderer.c",
              sdf_compile_anchor,
              sdf_compile_replacement
          )

          boot_tail_anchor = '''    runner->frameCount++;
          }

          // ===[ Surface Stack ]==='''

          boot_tail_replacement = r'''#ifdef PLATFORM_IOS
              static int32_t iosBootLastRoom =
                  -9999;

              static int32_t iosBootRoomFrames =
                  0;

              if (
                  runner->currentRoomIndex !=
                  iosBootLastRoom
              ) {
                  iosBootLastRoom =
                      runner->currentRoomIndex;

                  iosBootRoomFrames = 0;

                  logInfo(
                      "iOS boot: entered room %d (%s)\n",
                      runner->currentRoomIndex,
                      runner->currentRoom != nullptr
                          ? runner->currentRoom->name
                          : "<null>"
                  );
              }

              iosBootRoomFrames++;

              if (runner->pendingRoom < 0) {
                  if (
                      runner->currentRoomIndex == 0 &&
                      iosBootRoomFrames > 10
                  ) {
                      logWarn(
                          "iOS boot fallback: preload -> splash\n"
                      );

                      runner->pendingRoom = 1;
                  }
                  else if (
                      runner->currentRoomIndex == 1 &&
                      iosBootRoomFrames > 240
                  ) {
                      logWarn(
                          "iOS boot fallback: splash -> epilepsy\n"
                      );

                      runner->pendingRoom = 2;
                  }
                  else if (
                      runner->currentRoomIndex == 2 &&
                      iosBootRoomFrames > 3600
                  ) {
                      logWarn(
                          "iOS boot fallback: epilepsy -> menu\n"
                      );

                      runner->pendingRoom = 4;
                  }
              }
          #endif

              runner->frameCount++;
          }

          // ===[ Surface Stack ]==='''

          replace(
              "src/runner.c",
              boot_tail_anchor,
              boot_tail_replacement
          )

          loop_hostfb_anchor = (
              "        if (gfx == MODERN_GL) {\\n"
              "            renderer = GLRenderer_create();\\n"
              "            hostFramebuffer = &((GLModernRenderer *)renderer)->hostFramebuffer;\\n"
              "        }"
          )

          loop_hostfb_replacement = (
              "        if (gfx == MODERN_GL) {\\n"
              "            renderer = GLRenderer_create();\\n"
              "            hostFramebuffer = &((GLModernRenderer *)renderer)->hostFramebuffer;\\n"
              "\\n"
              "#ifdef PLATFORM_IOS\\n"
              "            GLint iosDrawableFramebuffer = 0;\\n"
              "            glGetIntegerv(\\n"
              "                GL_FRAMEBUFFER_BINDING,\\n"
              "                &iosDrawableFramebuffer\\n"
              "            );\\n"
              "\\n"
              "            ((GLModernRenderer *)renderer)->hostFramebuffer =\\n"
              "                (GLuint)iosDrawableFramebuffer;\\n"
              "\\n"
              "            logInfo(\\n"
              "                \\"iOS: SDL drawable framebuffer = %u\\\\n\\",\\n"
              "                (unsigned int)iosDrawableFramebuffer\\n"
              "            );\\n"
              "#endif\\n"
              "        }"
          )

          replace(
              "src/loop.c",
              loop_hostfb_anchor,
              loop_hostfb_replacement
          )

          ofs_anchor = '''static char* resolveForRead(OverlayFileSystem* ofs, const char* relativePath) {
              char* normalized = normalizePath(relativePath);
              if (isAbsolute(normalized)) return normalized;

              // Check if the path is already resolved'''

          ofs_replacement = '''static char* resolveForRead(OverlayFileSystem* ofs, const char* relativePath) {
              char* normalized = normalizePath(relativePath);
              if (isAbsolute(normalized)) return normalized;

          #ifdef PLATFORM_IOS
              if (
                  strcmp(
                      normalized,
                      "localization.json"
                  ) == 0 ||
                  strcmp(
                      normalized,
                      "localization_ar_test.json"
                  ) == 0
              ) {
                  char* bundleFull =
                      joinPath(
                          ofs->bundlePath,
                          normalized
                      );

                  free(normalized);
                  return bundleFull;
              }
          #endif

              // Check if the path is already resolved'''

          replace(
              "src/overlay_file_system.c",
              ofs_anchor,
              ofs_replacement
          )

          gp_count_anchor = '''static RValue builtin_gamepad_get_device_count(VMContext* ctx, RValue* args, int32_t argCount) {
              Runner* runner = ctx->runner;
              if (runner == NULL || runner->gamepads == NULL) return RValue_makeReal(0.0);
              return RValue_makeReal((GMLReal) RunnerGamepad_getDeviceCount(runner->gamepads));
          }'''

          gp_count_replacement = '''static RValue builtin_gamepad_get_device_count(VMContext* ctx, RValue* args, int32_t argCount) {
              Runner* runner = ctx->runner;

              if (
                  runner == NULL ||
                  runner->gamepads == NULL
              )
                  return RValue_makeReal(0.0);

          #ifdef PLATFORM_IOS
              return RValue_makeReal(
                  (GMLReal)MAX_GAMEPADS
              );
          #else
              return RValue_makeReal(
                  (GMLReal)
                  RunnerGamepad_getDeviceCount(
                      runner->gamepads
                  )
              );
          #endif
          }'''

          replace(
              "src/vm_builtins.c",
              gp_count_anchor,
              gp_count_replacement
          )

          gp_connected_anchor = '''static RValue builtin_gamepad_is_connected(VMContext* ctx, RValue* args, int32_t argCount) {
              Runner* runner = ctx->runner;
              if (runner == NULL || runner->gamepads == NULL) return RValue_makeBool(false);
              int32_t device = RValue_toInt32(args[0]);
              return RValue_makeBool(RunnerGamepad_isConnected(runner->gamepads, device));
          }'''

          gp_connected_replacement = '''static RValue builtin_gamepad_is_connected(VMContext* ctx, RValue* args, int32_t argCount) {
              Runner* runner = ctx->runner;

              if (
                  runner == NULL ||
                  runner->gamepads == NULL
              )
                  return RValue_makeBool(false);

              int32_t device =
                  RValue_toInt32(args[0]);

          #ifdef PLATFORM_IOS
              if (device == 0)
                  return RValue_makeBool(true);
          #endif

              return RValue_makeBool(
                  RunnerGamepad_isConnected(
                      runner->gamepads,
                      device
                  )
              );
          }'''

          replace(
              "src/vm_builtins.c",
              gp_connected_anchor,
              gp_connected_replacement
          )

          gp_desc_anchor = '''static RValue builtin_gamepad_get_description(VMContext* ctx, RValue* args, int32_t argCount) {
              Runner* runner = ctx->runner;
              if (runner == NULL || runner->gamepads == NULL) return RValue_makeOwnedString(safeStrdup(""));
              int32_t device = RValue_toInt32(args[0]);
              const char* desc = RunnerGamepad_getDescription(runner->gamepads, device);
              return RValue_makeOwnedString(safeStrdup(desc));
          }'''

          gp_desc_replacement = '''static RValue builtin_gamepad_get_description(VMContext* ctx, RValue* args, int32_t argCount) {
              Runner* runner = ctx->runner;

              if (
                  runner == NULL ||
                  runner->gamepads == NULL
              )
                  return RValue_makeOwnedString(
                      safeStrdup("")
                  );

              int32_t device =
                  RValue_toInt32(args[0]);

          #ifdef PLATFORM_IOS
              if (device == 0) {
                  return RValue_makeOwnedString(
                      safeStrdup(
                          "XInput STANDARD GAMEPAD"
                      )
                  );
              }
          #endif

              const char* desc =
                  RunnerGamepad_getDescription(
                      runner->gamepads,
                      device
                  );

              return RValue_makeOwnedString(
                  safeStrdup(desc)
              );
          }'''

          replace(
              "src/vm_builtins.c",
              gp_desc_anchor,
              gp_desc_replacement
          )

          replace(
              "CMakeLists.txt",
              '''    elseif(BACKEND STREQUAL "sdl2")
                  add_compile_definitions(USE_SDL2)

                  find_package(PkgConfig REQUIRED)
                  pkg_check_modules(SDL2 REQUIRED sdl2)
                  target_include_directories(butterscotch PRIVATE ${SDL2_INCLUDE_DIRS})
                  target_link_directories(butterscotch PRIVATE ${SDL2_LIBRARY_DIRS})
                  set(BACKEND_LIBRARIES ${SDL2_LIBRARIES})''',
              '''    elseif(BACKEND STREQUAL "sdl2")
                  add_compile_definitions(USE_SDL2)

                  if(CMAKE_SYSTEM_NAME STREQUAL "iOS")
                      set(SDL_SHARED OFF CACHE BOOL "" FORCE)
                      set(SDL_STATIC ON CACHE BOOL "" FORCE)
                      set(SDL_TEST OFF CACHE BOOL "" FORCE)
                      set(SDL_TESTS OFF CACHE BOOL "" FORCE)
                      set(SDL2_DISABLE_INSTALL ON CACHE BOOL "" FORCE)

                      add_subdirectory(
                          vendor/SDL2
                          EXCLUDE_FROM_ALL
                      )

                      set(
                          BACKEND_LIBRARIES
                          SDL2::SDL2-static
                          SDL2::SDL2main
                      )
                  else()
                      find_package(PkgConfig REQUIRED)
                      pkg_check_modules(SDL2 REQUIRED sdl2)
                      target_include_directories(
                          butterscotch
                          PRIVATE
                          ${SDL2_INCLUDE_DIRS}
                      )
                      target_link_directories(
                          butterscotch
                          PRIVATE
                          ${SDL2_LIBRARY_DIRS}
                      )
                      set(
                          BACKEND_LIBRARIES
                          ${SDL2_LIBRARIES}
                      )
                  endif()'''
          )

          replace(
              "CMakeLists.txt",
              'if(NOT PLATFORM STREQUAL "vita" AND NOT PLATFORM STREQUAL "switch")\n        # GLAD',
              'if(NOT PLATFORM STREQUAL "vita" AND NOT PLATFORM STREQUAL "switch" AND NOT CMAKE_SYSTEM_NAME STREQUAL "iOS")\n        # GLAD'
          )

          replace(
              "CMakeLists.txt",
              'target_include_directories(butterscotch PRIVATE src/${PLATFORM})',
              '''target_include_directories(butterscotch PRIVATE src/${PLATFORM})

          if(CMAKE_SYSTEM_NAME STREQUAL "iOS")
              target_compile_definitions(
                  butterscotch PRIVATE
                  PLATFORM_IOS
              )

              target_sources(
                  butterscotch PRIVATE
                  src/ios/ios_overlay.m
              )

              set_target_properties(
                  butterscotch PROPERTIES
                  MACOSX_BUNDLE TRUE
                  OUTPUT_NAME "PostVoid"
                  MACOSX_BUNDLE_INFO_PLIST "${CMAKE_SOURCE_DIR}/ios/Info.plist"
