              dot.translatesAutoresizingMaskIntoConstraints =
                  NO;

              dot.userInteractionEnabled =
                  NO;

              dot.backgroundColor =
                  [UIColor
                      colorWithWhite:1.0
                      alpha:0.42];

              CGFloat dotSize =
                  size * 0.30;

              dot.layer.cornerRadius =
                  dotSize / 2.0;

              [ring addSubview:dot];

              [
                  NSLayoutConstraint
                  activateConstraints:@[
                      [
                          dot.widthAnchor
                          constraintEqualToConstant:
                          dotSize
                      ],
                      [
                          dot.heightAnchor
                          constraintEqualToConstant:
                          dotSize
                      ],
                      [
