                  ) != 0
              ) {
                  fprintf(
                      stderr,
                      "ERROR: game.droid missing\n"
                  );

                  SDL_free(base);
                  return 22;
              }

              CommandLineArgs args = {
                  0
              };

              args.dataWinPath =
                  gamePath;

              args.saveFolder =
