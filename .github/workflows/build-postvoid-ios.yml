          #import <UIKit/UIKit.h>
          #import <QuartzCore/QuartzCore.h>

          static UIImageView *PVImage(
              NSString *name,
              CGFloat size,
              CGFloat alpha
          ) {
              UIImage *image =
                  [UIImage imageNamed:name];

              UIImageView *view =
                  [[UIImageView alloc]
                      initWithImage:image];

              view.translatesAutoresizingMaskIntoConstraints =
                  NO;

              view.contentMode =
                  UIViewContentModeScaleAspectFit;

              view.alpha =
                  alpha;

              view.userInteractionEnabled =
                  NO;

              [NSLayoutConstraint activateConstraints:@[
                  [
                      view.widthAnchor
                      constraintEqualToConstant:
                      size
                  ],
                  [
                      view.heightAnchor
                      constraintEqualToConstant:
                      size
                  ]
              ]];

              return view;
          }

          static UIView *PVStickRing(
              CGFloat size
          ) {
              UIView *ring =
                  [[UIView alloc]
                      initWithFrame:
                      CGRectZero];

              ring.translatesAutoresizingMaskIntoConstraints =
                  NO;

              ring.userInteractionEnabled =
                  NO;

              ring.backgroundColor =
                  [UIColor
                      colorWithWhite:0.0
                      alpha:0.10];

              ring.layer.borderWidth =
                  3.0;

              ring.layer.borderColor =
                  [UIColor
                      colorWithWhite:1.0
                      alpha:0.58]
                      .CGColor;

              ring.layer.cornerRadius =
                  size / 2.0;

              [
                  NSLayoutConstraint
                  activateConstraints:@[
                      [
                          ring.widthAnchor
                          constraintEqualToConstant:
                          size
                      ],
                      [
                          ring.heightAnchor
                          constraintEqualToConstant:
                          size
                      ]
                  ]
              ];

              UIView *dot =
                  [[UIView alloc]
                      initWithFrame:
