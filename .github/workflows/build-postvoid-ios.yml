          #include <unistd.h>

          void platformLog(
              const logType type,
              const char *format,
              va_list va
          ) {
              FILE *out = stderr;

              switch (type) {
                  case LOG_TYPE_NORMAL:
                      out = stdout;
                      break;

                  case LOG_TYPE_WARNING:
                      fputs(
                          "Warning: ",
                          out
                      );
                      break;

                  case LOG_TYPE_ERROR:
                      fputs(
                          "Error: ",
                          out
                      );
                      break;

                  case LOG_TYPE_DEBUG:
                      fputs(
                          "Debug: ",
                          out
                      );
                      break;
              }

              vfprintf(
                  out,
                  format,
                  va
              );

              fflush(out);
          }

          static void ensureDir(
              const char *path
          ) {
              if (
                  path &&
                  path[0]
              )
                  mkdir(
                      path,
                      0755
                  );
          }

          int main(
              int argc,
              char **argv
          ) {
              (void)argc;

              setbuf(
                  stdout,
                  NULL
              );

              setbuf(
                  stderr,
                  NULL
