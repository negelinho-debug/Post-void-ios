name: POST VOID iOS Port

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build POST VOID iOS IPA
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          set -e
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          clang --version

      - name: Prepare folders
        run: |
          set -e
          mkdir -p input work logs out

      - name: Download full POST VOID APK from Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching Releases for an APK..."

          TAG=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue

            if gh release view "$tag" \
              --json assets \
              --jq '.assets[].name' \
              | grep -Eiq '\.apk$'; then
              TAG="$tag"
              break
            fi
          done < <(
            gh release list \
              --limit 50 \
              --json tagName \
              --jq '.[].tagName'
          )

          if [ -z "$TAG" ]; then
            echo "ERROR: No Release containing an APK was found."
            exit 1
          fi

          echo "Using Release: $TAG"

          rm -rf input/apks
          mkdir -p input/apks

          gh release download "$TAG" \
            --pattern "*.apk" \
            --dir input/apks \
            --clobber

          APK="$(python3 - <<'PY'
          from pathlib import Path
          files = list(Path('input/apks').glob('*.apk'))
          if not files:
              raise SystemExit(1)
          print(max(files, key=lambda p: p.stat().st_size))
          PY
          )"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK download failed."
            exit 1
          fi

          SIZE="$(stat -f%z "$APK")"
          echo "APK: $APK"
          ls -lh "$APK"

          if [ "$SIZE" -lt 100000000 ]; then
            echo "ERROR: The APK is smaller than 100 MB."
            echo "It looks like the BYOD build, not the full POST VOID package."
            exit 1
          fi

          echo "APK=$GITHUB_WORKSPACE/$APK" >> "$GITHUB_ENV"

      - name: Extract Android port
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work/apk work/game_data work/game
          rm -f work/data0.zip work/game_data.apk

          # Extract ONLY assets/data0 directly from the APK.
          # The APK contains duplicate resource paths, so extracting the whole
          # archive with unzip can stop on an interactive overwrite prompt.
          unzip -p "$APK" assets/data0 > work/data0.zip

          test -s work/data0.zip

          echo "POST VOID data0 extracted:"
          ls -lh work/data0.zip

      - name: Find embedded game data
        shell: bash
        run: |
          set -euo pipefail

          unzip -p work/data0.zip \
            files/game_data.apk \
            > work/game_data.apk

          test -s work/game_data.apk

          rm -rf work/game_data
          mkdir -p work/game_data

          unzip -oq work/game_data.apk \
            -d work/game_data

          test -f work/game_data/assets/game.droid

          rm -rf work/game
          mkdir -p work/game
          cp -R work/game_data/assets/. work/game/

          python3 - <<'PY'
          from pathlib import Path

          p = Path('work/game/game.droid')
          data = p.read_bytes()[:4]
          print('game.droid header:', data)

          if data != b'FORM':
              raise SystemExit('ERROR: game.droid is not a valid GameMaker data package')
          PY

          echo "Embedded full game data found:"
          du -sh work/game
          ls -lh work/game/game.droid
          find work/game -maxdepth 2 -type f -print

      - name: Get Butterscotch GameMaker runner
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work/Butterscotch

          git clone \
            https://github.com/ButterscotchRunner/Butterscotch.git \
            work/Butterscotch

          git -C work/Butterscotch \
            checkout d05526846e75449295ed2596bd86e9db0108408a

          git -C work/Butterscotch \
            submodule update --init --recursive

          rm -rf work/Butterscotch/vendor/SDL2

          git clone \
            --depth 1 \
            --branch release-2.32.10 \
            https://github.com/libsdl-org/SDL.git \
            work/Butterscotch/vendor/SDL2

      - name: Create iOS runner project
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import textwrap

          root = Path('work/Butterscotch')

          def replace(path, old, new, count=1):
              p = root / path
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Patch anchor missing in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, count))

          # ----------------------------------------------------------
          # 1. Tell the OpenGL renderer to use iOS OpenGL ES headers.
          # ----------------------------------------------------------
          for rel in [
              'src/gl_common/gl_common.h',
              'src/gl/gl_renderer.h',
              'src/gl/gl_renderer.c',
          ]:
              replace(
                  rel,
                  '#if defined(__EMSCRIPTEN__) || defined(__ANDROID__) || defined(__SWITCH__)\n#include <GLES3/gl3.h>',
                  '#if defined(PLATFORM_IOS)\n#include <OpenGLES/ES3/gl.h>\n#elif defined(__EMSCRIPTEN__) || defined(__ANDROID__) || defined(__SWITCH__)\n#include <GLES3/gl3.h>',
              )

          replace(
              'src/gl/gl_renderer.c',
              '#if !defined(__EMSCRIPTEN__) && !defined(__ANDROID__) && !defined(__VITA__) && !defined(__SWITCH__)',
              '#if !defined(__EMSCRIPTEN__) && !defined(__ANDROID__) && !defined(__VITA__) && !defined(__SWITCH__) && !defined(PLATFORM_IOS)',
              count=2,
          )

          replace(
              'src/loop.c',
              '!defined(__EMSCRIPTEN__) && !defined(__ANDROID__) && !defined(PLATFORM_PS3) && !defined(PLATFORM_VITA) && !defined(__SWITCH__)',
              '!defined(__EMSCRIPTEN__) && !defined(__ANDROID__) && !defined(PLATFORM_IOS) && !defined(PLATFORM_PS3) && !defined(PLATFORM_VITA) && !defined(__SWITCH__)',
          )

          # ----------------------------------------------------------
          # 2. Build SDL2 inside the same Xcode project on iOS.
          # ----------------------------------------------------------
          replace(
              'CMakeLists.txt',
              '''    elseif(BACKEND STREQUAL "sdl2")
                  add_compile_definitions(USE_SDL2)

                  find_package(PkgConfig REQUIRED)
                  pkg_check_modules(SDL2 REQUIRED sdl2)
                  target_include_directories(butterscotch PRIVATE ${SDL2_INCLUDE_DIRS})
                  target_link_directories(butterscotch PRIVATE ${SDL2_LIBRARY_DIRS})
                  set(BACKEND_LIBRARIES ${SDL2_LIBRARIES})''',
              '''    elseif(BACKEND STREQUAL "sdl2")
                  add_compile_definitions(USE_SDL2)

                  if(CMAKE_SYSTEM_NAME STREQUAL "iOS")
                      set(SDL_SHARED OFF CACHE BOOL "" FORCE)
                      set(SDL_STATIC ON CACHE BOOL "" FORCE)
                      set(SDL_TEST OFF CACHE BOOL "" FORCE)
                      set(SDL_TESTS OFF CACHE BOOL "" FORCE)
                      set(SDL2_DISABLE_INSTALL ON CACHE BOOL "" FORCE)

                      add_subdirectory(vendor/SDL2 EXCLUDE_FROM_ALL)

                      set(BACKEND_LIBRARIES
                          SDL2::SDL2-static
                          SDL2::SDL2main
                      )
                  else()
                      find_package(PkgConfig REQUIRED)
                      pkg_check_modules(SDL2 REQUIRED sdl2)
                      target_include_directories(butterscotch PRIVATE ${SDL2_INCLUDE_DIRS})
                      target_link_directories(butterscotch PRIVATE ${SDL2_LIBRARY_DIRS})
                      set(BACKEND_LIBRARIES ${SDL2_LIBRARIES})
                  endif()''',
          )

          # GLAD is for desktop OpenGL. iPhone uses GLES directly.
          replace(
              'CMakeLists.txt',
              'if(NOT PLATFORM STREQUAL "vita" AND NOT PLATFORM STREQUAL "switch")\n        # GLAD',
              'if(NOT PLATFORM STREQUAL "vita" AND NOT PLATFORM STREQUAL "switch" AND NOT CMAKE_SYSTEM_NAME STREQUAL "iOS")\n        # GLAD',
          )

          # ----------------------------------------------------------
          # 3. Turn the executable into an iPhone .app bundle.
          # ----------------------------------------------------------
          replace(
              'CMakeLists.txt',
              'target_include_directories(butterscotch PRIVATE src/${PLATFORM})',
              '''target_include_directories(butterscotch PRIVATE src/${PLATFORM})

          if(CMAKE_SYSTEM_NAME STREQUAL "iOS")
              target_compile_definitions(
                  butterscotch PRIVATE
                  PLATFORM_IOS
              )

              set_target_properties(
                  butterscotch PROPERTIES
                  MACOSX_BUNDLE TRUE
                  OUTPUT_NAME "PostVoid"
                  MACOSX_BUNDLE_INFO_PLIST "${CMAKE_SOURCE_DIR}/ios/Info.plist"
                  XCODE_ATTRIBUTE_PRODUCT_BUNDLE_IDENTIFIER "com.ourports.postvoid"
                  XCODE_ATTRIBUTE_TARGETED_DEVICE_FAMILY "1,2"
                  XCODE_ATTRIBUTE_IPHONEOS_DEPLOYMENT_TARGET "15.0"
                  XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED "NO"
                  XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED "NO"
                  XCODE_ATTRIBUTE_ENABLE_BITCODE "NO"
                  XCODE_ATTRIBUTE_ONLY_ACTIVE_ARCH "NO"
              )

              target_link_options(
                  butterscotch PRIVATE
                  "-ObjC"
              )

              target_link_libraries(
                  butterscotch PRIVATE
                  "-framework UIKit"
                  "-framework Foundation"
                  "-framework CoreFoundation"
                  "-framework CoreGraphics"
                  "-framework QuartzCore"
                  "-framework OpenGLES"
                  "-framework CoreAudio"
                  "-framework AudioToolbox"
                  "-framework AVFoundation"
                  "-framework GameController"
                  "-framework CoreMotion"
              )
          endif()''',
          )

          # ----------------------------------------------------------
          # 4. iOS main(): load bundled game.droid and save to Documents.
          # ----------------------------------------------------------
          main_c = r'''
          #include <SDL2/SDL.h>
          #include <SDL2/SDL_main.h>
          #include <loop.h>

          #include <limits.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/stat.h>
          #include <unistd.h>

          static void ensureDir(const char *path) {
              if (path && path[0])
                  mkdir(path, 0755);
          }

          int main(int argc, char **argv) {
              (void)argc;

              setbuf(stdout, NULL);
              setbuf(stderr, NULL);

              SDL_SetHint(SDL_HINT_TOUCH_MOUSE_EVENTS, "0");
              SDL_SetHint(SDL_HINT_MOUSE_TOUCH_EVENTS, "0");

              char *base = SDL_GetBasePath();
              if (!base)
                  return 20;

              if (chdir(base) != 0) {
                  SDL_free(base);
                  return 21;
              }

              char gamePath[PATH_MAX];
              snprintf(
                  gamePath,
                  sizeof(gamePath),
                  "%sgame.droid",
                  base
              );

              const char *home = getenv("HOME");

              char docsPath[PATH_MAX];
              char savePath[PATH_MAX];
              char logPath[PATH_MAX];

              snprintf(
                  docsPath,
                  sizeof(docsPath),
                  "%s/Documents",
                  home ? home : "."
              );

              ensureDir(docsPath);

              snprintf(
                  savePath,
                  sizeof(savePath),
                  "%s/Documents/PostVoid",
                  home ? home : "."
              );

              ensureDir(savePath);

              snprintf(
                  logPath,
                  sizeof(logPath),
                  "%s/runtime.log",
                  savePath
              );

              freopen(logPath, "a", stdout);
              freopen(logPath, "a", stderr);

              fprintf(stderr, "=== POST VOID iOS ===\n");
              fprintf(stderr, "base: %s\n", base);
              fprintf(stderr, "game: %s\n", gamePath);
              fprintf(stderr, "save: %s\n", savePath);

              if (access(gamePath, R_OK) != 0) {
                  fprintf(stderr, "ERROR: game.droid is missing\n");
                  SDL_free(base);
                  return 22;
              }

              CommandLineArgs args = {0};

              args.dataWinPath = gamePath;
              args.saveFolder = savePath;
              args.exitAtFrame = -1;

          #ifdef ENABLE_VM_TRACING
              args.traceBytecodeAfterFrame = 0;
          #endif

              args.speedMultiplier = 1.0;
              args.fastForwardSpeed = 0.0;
              args.osType = OS_ANDROID;
              args.windowWidth = 1280;
              args.windowHeight = 720;
              args.widescreenAspect = 16.0f / 9.0f;
              args.profilerFramesBetween = 0;
              args.loadType = DATAWINLOADTYPE_LOAD_PER_CHUNK;
              args.lazyRooms = true;
              args.lazyTextures = true;
              args.lazyAudio = true;
              args.renderer = MODERN_GL;
              args.disableLogColours = true;
              args.alwaysLogUnknownFunctions = true;

          #ifdef ENABLE_VM_STUB_LOGS
              args.alwaysLogStubbedFunctions = true;
          #endif

              int ret = loop(args, argv[0]);

              freeCommandLineArgs(&args);

              fprintf(stderr, "runner exited: %d\n", ret);

              SDL_free(base);
              return ret;
          }
          '''

          (root / 'src/cli/main.c').write_text(
              textwrap.dedent(main_c).lstrip()
          )

          # ----------------------------------------------------------
          # 5. Invisible touch gamepad:
          #    left half = movement
          #    right half = aim
          #    bottom-right = shoot (RT)
          #    button next to it = A/action
          #    top-right = Start/pause
          # ----------------------------------------------------------
          p = root / 'src/backends/sdl2.c'
          s = p.read_text()

          anchor = 'static SDL_GameController* openControllers[MAX_GAMEPADS];\n'
          if anchor not in s:
              raise SystemExit('Touch patch anchor 1 missing')

          touch_state = r'''

          #ifdef PLATFORM_IOS

          typedef struct {
              bool active;
              SDL_FingerID id;
              float startX;
              float startY;
              float x;
              float y;
          } IOSTouchStick;

          typedef struct {
              bool active;
              SDL_FingerID id;
          } IOSTouchButton;

          static IOSTouchStick iosLeft = {0};
          static IOSTouchStick iosRight = {0};

          static IOSTouchButton iosFire = {0};
          static IOSTouchButton iosAction = {0};
          static IOSTouchButton iosExtra = {0};
          static IOSTouchButton iosPause = {0};

          static float iosClamp(float value) {
              if (value < -1.0f) return -1.0f;
              if (value > 1.0f) return 1.0f;
              return value;
          }

          static void iosStartStick(
              IOSTouchStick *stick,
              SDL_FingerID id,
              float x,
              float y
          ) {
              stick->active = true;
              stick->id = id;
              stick->startX = x;
              stick->startY = y;
              stick->x = x;
              stick->y = y;
          }

          static void iosFingerDown(
              const SDL_TouchFingerEvent *f
          ) {
              float x = f->x;
              float y = f->y;

              if (x > 0.88f && y < 0.20f && !iosPause.active) {
                  iosPause.active = true;
                  iosPause.id = f->fingerId;
                  return;
              }

              if (x > 0.82f && y > 0.62f && !iosFire.active) {
                  iosFire.active = true;
                  iosFire.id = f->fingerId;
                  return;
              }

              if (
                  x > 0.68f && x <= 0.82f &&
                  y > 0.68f &&
                  !iosAction.active
              ) {
                  iosAction.active = true;
                  iosAction.id = f->fingerId;
                  return;
              }

              if (
                  x > 0.55f && x <= 0.68f &&
                  y > 0.72f &&
                  !iosExtra.active
              ) {
                  iosExtra.active = true;
                  iosExtra.id = f->fingerId;
                  return;
              }

              if (x < 0.46f && !iosLeft.active) {
                  iosStartStick(
                      &iosLeft,
                      f->fingerId,
                      x,
                      y
                  );
                  return;
              }

              if (!iosRight.active) {
                  iosStartStick(
                      &iosRight,
                      f->fingerId,
                      x,
                      y
                  );
              }
          }

          static void iosFingerMotion(
              const SDL_TouchFingerEvent *f
          ) {
              if (iosLeft.active && iosLeft.id == f->fingerId) {
                  iosLeft.x = f->x;
                  iosLeft.y = f->y;
              }

              if (iosRight.active && iosRight.id == f->fingerId) {
                  iosRight.x = f->x;
                  iosRight.y = f->y;
              }
          }

          static void iosFingerUp(
              const SDL_TouchFingerEvent *f
          ) {
              if (iosLeft.active && iosLeft.id == f->fingerId)
                  iosLeft.active = false;

              if (iosRight.active && iosRight.id == f->fingerId)
                  iosRight.active = false;

              if (iosFire.active && iosFire.id == f->fingerId)
                  iosFire.active = false;

              if (iosAction.active && iosAction.id == f->fingerId)
                  iosAction.active = false;

              if (iosExtra.active && iosExtra.id == f->fingerId)
                  iosExtra.active = false;

              if (iosPause.active && iosPause.id == f->fingerId)
                  iosPause.active = false;
          }

          static void iosApplyTouchGamepad(void) {
              bool hasPhysicalController = false;

              for (int i = 0; i < MAX_GAMEPADS; i++) {
                  if (
                      openControllers[i] &&
                      SDL_GameControllerGetAttached(openControllers[i])
                  ) {
                      hasPhysicalController = true;
                      break;
                  }
              }

              if (hasPhysicalController)
                  return;

              GamepadSlot *slot = &g_runner->gamepads->slots[0];

              slot->connected = true;
              slot->jid = 0;

              strncpy(
                  slot->description,
                  "POST VOID iOS Touch",
                  sizeof(slot->description) - 1
              );
              slot->description[sizeof(slot->description) - 1] = '\0';

              strncpy(
                  slot->guid,
                  "postvoid-ios-touch",
                  sizeof(slot->guid) - 1
              );
              slot->guid[sizeof(slot->guid) - 1] = '\0';

              const float radius = 0.105f;

              if (iosLeft.active) {
                  slot->axisValue[0] = iosClamp(
                      (iosLeft.x - iosLeft.startX) / radius
                  );
                  slot->axisValue[1] = iosClamp(
                      (iosLeft.y - iosLeft.startY) / radius
                  );
              }

              if (iosRight.active) {
                  slot->axisValue[2] = iosClamp(
                      (iosRight.x - iosRight.startX) / radius
                  );
                  slot->axisValue[3] = iosClamp(
                      (iosRight.y - iosRight.startY) / radius
                  );
              }

              /* A / X / RT / Start */
              slot->buttonDown[0] = iosAction.active;
              slot->buttonDown[2] = iosExtra.active;
              slot->buttonDown[7] = iosFire.active;
              slot->buttonDown[9] = iosPause.active;

              slot->buttonValue[0] = iosAction.active ? 1.0f : 0.0f;
              slot->buttonValue[2] = iosExtra.active ? 1.0f : 0.0f;
              slot->buttonValue[7] = iosFire.active ? 1.0f : 0.0f;
              slot->buttonValue[9] = iosPause.active ? 1.0f : 0.0f;

              for (int btn = 0; btn < GP_BUTTON_COUNT; btn++) {
                  bool wasDown = slot->buttonDownPrev[btn];

                  if (slot->buttonDown[btn] && !wasDown)
                      slot->buttonPressed[btn] = true;

                  if (!slot->buttonDown[btn] && wasDown)
                      slot->buttonReleased[btn] = true;
              }

              g_runner->gamepads->connectedCount = 1;
          }

          #endif
          '''

          s = s.replace(
              anchor,
              anchor + textwrap.dedent(touch_state),
              1,
          )

          event_anchor = '''            case SDL_MOUSEWHEEL:
                          if (e.wheel.y != 0)
                              RunnerMouse_onWheel(g_runner->mouse, (float)e.wheel.y);
                          break;'''

          if event_anchor not in s:
              raise SystemExit('Touch patch anchor 2 missing')

          event_replacement = event_anchor + r'''
          #ifdef PLATFORM_IOS
                      case SDL_FINGERDOWN:
                          iosFingerDown(&e.tfinger);
                          break;

                      case SDL_FINGERMOTION:
                          iosFingerMotion(&e.tfinger);
                          break;

                      case SDL_FINGERUP:
                          iosFingerUp(&e.tfinger);
                          break;
          #endif
          '''

          s = s.replace(
              event_anchor,
              event_replacement,
              1,
          )

          end_anchor = '''    }

              return false;
          #endif
          }'''

          if end_anchor not in s:
              raise SystemExit('Touch patch anchor 3 missing')

          end_replacement = '''    }

          #ifdef PLATFORM_IOS
              iosApplyTouchGamepad();
          #endif

              return false;
          #endif
          }'''

          s = s.replace(
              end_anchor,
              end_replacement,
              1,
          )

          p.write_text(s)

          # ----------------------------------------------------------
          # 6. iPhone Info.plist.
          # ----------------------------------------------------------
          ios = root / 'ios'
          ios.mkdir(exist_ok=True)

          plist = r'''<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>

              <key>CFBundleDisplayName</key>
              <string>POST VOID</string>

              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>

              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>

              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>

              <key>CFBundleName</key>
              <string>POST VOID</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>1.0</string>

              <key>CFBundleVersion</key>
              <string>1</string>

              <key>LSRequiresIPhoneOS</key>
              <true/>

              <key>MinimumOSVersion</key>
              <string>15.0</string>

              <key>UIRequiresFullScreen</key>
              <true/>

              <key>UIStatusBarHidden</key>
              <true/>

              <key>UIViewControllerBasedStatusBarAppearance</key>
              <false/>

              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>

              <key>UISupportedInterfaceOrientations~ipad</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>

              <key>UIFileSharingEnabled</key>
              <true/>

              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>

              <key>UIApplicationSupportsIndirectInputEvents</key>
              <true/>

              <key>UILaunchScreen</key>
              <dict/>
          </dict>
          </plist>
          '''

          (ios / 'Info.plist').write_text(
              textwrap.dedent(plist).lstrip()
          )

          print('iOS runner patch complete')
          PY

      - name: Configure ARM64 iOS runner
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work/build

          cmake \
            -S work/Butterscotch \
            -B work/build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DPLATFORM=cli \
            -DBACKEND=sdl2 \
            -DAUDIO_BACKEND=miniaudio \
            -DENABLE_WAD14=ON \
            -DENABLE_WAD16=ON \
            -DENABLE_WAD17=ON \
            -DENABLE_LEGACY_GL=OFF \
            -DENABLE_MODERN_GL=ON \
            -DENABLE_VM_GML_PROFILER=OFF \
            -DENABLE_VM_TRACING=OFF \
            -DENABLE_VM_OPCODE_PROFILER=OFF \
            -DENABLE_VM_STUB_LOGS=ON \
            -DENABLE_ASAN=OFF \
            2>&1 | tee logs/configure.log

      - name: Compile ARM64 iOS runner
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build work/build \
            --config Release \
            --target butterscotch \
            2>&1 | tee logs/build.log

          APP="$(
            find work/build \
              -type d \
              -name 'PostVoid.app' \
              | head -n 1
          )"

          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "ERROR: PostVoid.app was not produced."
            find work/build -maxdepth 6 -type f | sort | tail -300
            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"

          echo "Built app: $APP"
          ls -la "$APP"

          test -f "$APP/PostVoid"
          file "$APP/PostVoid"
          lipo -info "$APP/PostVoid" || true

      - name: Add complete POST VOID game data
        shell: bash
        run: |
          set -euo pipefail

          cp -R work/game/. "$APP/"

          test -f "$APP/game.droid"
          test -f "$APP/options.ini"
          test -f "$APP/localization.json"
          test -f "$APP/gamecontrollerdb.txt"

          echo "Final app contents:"
          du -sh "$APP"
          ls -lh "$APP/game.droid"

      - name: Ad-hoc sign
        shell: bash
        run: |
          set -euo pipefail

          xattr -cr "$APP" || true

          codesign \
            --force \
            --sign - \
            --timestamp=none \
            "$APP"

          codesign -vv "$APP"

      - name: Build IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work/Payload
          mkdir -p work/Payload

          cp -R "$APP" work/Payload/PostVoid.app

          rm -f out/POST-VOID-iOS-v2-FASTFIX-unsigned.ipa

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            work/Payload \
            out/POST-VOID-iOS-v2-FASTFIX-unsigned.ipa

          test -s out/POST-VOID-iOS-v2-FASTFIX-unsigned.ipa

          echo "IPA ready:"
          ls -lh out/POST-VOID-iOS-v2-FASTFIX-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: POST-VOID-iOS-v2-FASTFIX
          path: out/POST-VOID-iOS-v2-FASTFIX-unsigned.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POST-VOID-iOS-build-logs
          path: logs/
          if-no-files-found: ignore
