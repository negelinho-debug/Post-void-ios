name: POST VOID iOS Port

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build POST VOID iOS IPA
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          set -e
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          clang --version

      - name: Prepare folders
        run: |
          set -e
          mkdir -p input work logs out

      - name: Download full POST VOID APK from Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching Releases for an APK..."

          TAG=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue

            if gh release view "$tag" \
              --json assets \
              --jq '.assets[].name' \
              | grep -Eiq '\.apk$'; then
              TAG="$tag"
              break
            fi
          done < <(
            gh release list \
              --limit 50 \
              --json tagName \
              --jq '.[].tagName'
          )

          if [ -z "$TAG" ]; then
            echo "ERROR: No Release containing an APK was found."
            exit 1
          fi

          echo "Using Release: $TAG"

          rm -rf input/apks
          mkdir -p input/apks

          gh release download "$TAG" \
            --pattern "*.apk" \
            --dir input/apks \
            --clobber

          APK="$(python3 - <<'PY'
          from pathlib import Path
          files = list(Path('input/apks').glob('*.apk'))
          if not files:
              raise SystemExit(1)
          print(max(files, key=lambda p: p.stat().st_size))
          PY
          )"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK download failed."
            exit 1
          fi

          SIZE="$(stat -f%z "$APK")"
          echo "APK: $APK"
          ls -lh "$APK"

          if [ "$SIZE" -lt 100000000 ]; then
            echo "ERROR: The APK is smaller than 100 MB."
            echo "It looks like the BYOD build, not the full POST VOID package."
            exit 1
          fi

          echo "APK=$GITHUB_WORKSPACE/$APK" >> "$GITHUB_ENV"

      - name: Extract Android port
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work/apk work/game_data work/game
          rm -f work/data0.zip work/game_data.apk

          # Extract ONLY assets/data0 directly from the APK.
          # The APK contains duplicate resource paths, so extracting the whole
          # archive with unzip can stop on an interactive overwrite prompt.
          unzip -p "$APK" assets/data0 > work/data0.zip

          test -s work/data0.zip

          echo "POST VOID data0 extracted:"
          ls -lh work/data0.zip

      - name: Find embedded game data
        shell: bash
        run: |
          set -euo pipefail

          unzip -p work/data0.zip \
            files/game_data.apk \
            > work/game_data.apk

          test -s work/game_data.apk

          rm -rf work/game_data
          mkdir -p work/game_data

          unzip -oq work/game_data.apk \
            -d work/game_data

          test -f work/game_data/assets/game.droid

          rm -rf work/game
          mkdir -p work/game
          cp -R work/game_data/assets/. work/game/

          python3 - <<'PY'
          from pathlib import Path

          p = Path('work/game/game.droid')
          data = p.read_bytes()[:4]
          print('game.droid header:', data)

          if data != b'FORM':
              raise SystemExit('ERROR: game.droid is not a valid GameMaker data package')
          PY

          echo "Embedded full game data found:"
          du -sh work/game
          ls -lh work/game/game.droid
          find work/game -maxdepth 2 -type f -print

      - name: Extract original POST VOID icon and buttons
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/ui

          unzip -p "$APK" 'res/o-.png' > work/ui/IconSource.png
          unzip -p "$APK" 'res/2_.png' > work/ui/PV_pause.png
          unzip -p "$APK" 'res/t3.png' > work/ui/PV_fire.png
          unzip -p "$APK" 'res/UF.png' > work/ui/PV_jump.png
          unzip -p "$APK" 'res/5J.png' > work/ui/PV_extra.png

          test -s work/ui/IconSource.png
          test -s work/ui/PV_pause.png
          test -s work/ui/PV_fire.png
          test -s work/ui/PV_jump.png
          test -s work/ui/PV_extra.png

          sips -z 180 180 work/ui/IconSource.png             --out work/ui/Icon-60@3x.png >/dev/null

          sips -z 120 120 work/ui/IconSource.png             --out work/ui/Icon-60@2x.png >/dev/null

          echo "Original icon/buttons extracted:"
          ls -lh work/ui

      - name: Get Butterscotch GameMaker runner
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work/Butterscotch

          git clone \
            https://github.com/ButterscotchRunner/Butterscotch.git \
            work/Butterscotch

          git -C work/Butterscotch \
            checkout d05526846e75449295ed2596bd86e9db0108408a

          git -C work/Butterscotch \
            submodule update --init --recursive

          rm -rf work/Butterscotch/vendor/SDL2

          git clone \
            --depth 1 \
            --branch release-2.32.10 \
            https://github.com/libsdl-org/SDL.git \
            work/Butterscotch/vendor/SDL2

      - name: Create iOS runner project
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import textwrap

          root = Path('work/Butterscotch')

          def replace(path, old, new, count=1):
              p = root / path
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Patch anchor missing in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, count))

          replace(
              'CMakeLists.txt',
              'project(butterscotch C)',
              '''if(CMAKE_SYSTEM_NAME STREQUAL "iOS")
          project(butterscotch C OBJC)
          else()
          project(butterscotch C)
          endif()''',
          )

          # ----------------------------------------------------------
          # 1. Tell the OpenGL renderer to use iOS OpenGL ES headers.
          # ----------------------------------------------------------
          for rel in [
              'src/gl_common/gl_common.h',
              'src/gl/gl_renderer.h',
              'src/gl/gl_renderer.c',
          ]:
              replace(
                  rel,
                  '#if defined(__EMSCRIPTEN__) || defined(__ANDROID__) || defined(__SWITCH__)\n#include <GLES3/gl3.h>',
                  '#if defined(PLATFORM_IOS)\n#include <OpenGLES/ES3/gl.h>\n#elif defined(__EMSCRIPTEN__) || defined(__ANDROID__) || defined(__SWITCH__)\n#include <GLES3/gl3.h>',
              )

          replace(
              'src/gl/gl_renderer.c',
              '#if !defined(__EMSCRIPTEN__) && !defined(__ANDROID__) && !defined(__VITA__) && !defined(__SWITCH__)',
              '#if !defined(__EMSCRIPTEN__) && !defined(__ANDROID__) && !defined(__VITA__) && !defined(__SWITCH__) && !defined(PLATFORM_IOS)',
              count=2,
          )

          replace(
              'src/loop.c',
              '!defined(__EMSCRIPTEN__) && !defined(__ANDROID__) && !defined(PLATFORM_PS3) && !defined(PLATFORM_VITA) && !defined(__SWITCH__)',
              '!defined(__EMSCRIPTEN__) && !defined(__ANDROID__) && !defined(PLATFORM_IOS) && !defined(PLATFORM_PS3) && !defined(PLATFORM_VITA) && !defined(__SWITCH__)',
          )

          replace(
              'src/gl_common/gl_wrappers.h',
              '#if !defined(_BS_GL_WRAPPERS_H_) && !defined(__EMSCRIPTEN__) && !defined(PLATFORM_PS3) && !defined(PLATFORM_VITA) && !defined(__ANDROID__) && !defined(__SWITCH__)',
              '#if !defined(_BS_GL_WRAPPERS_H_) && !defined(__EMSCRIPTEN__) && !defined(PLATFORM_PS3) && !defined(PLATFORM_VITA) && !defined(__ANDROID__) && !defined(__SWITCH__) && !defined(PLATFORM_IOS)',
          )

          replace(
              'src/gl_common/gl_common.c',
              '#if !defined(__EMSCRIPTEN__) && !defined(__ANDROID__) && !defined(PLATFORM_VITA) && !defined(__SWITCH__) && !defined(PLATFORM_PS3)',
              '#if !defined(__EMSCRIPTEN__) && !defined(__ANDROID__) && !defined(PLATFORM_VITA) && !defined(__SWITCH__) && !defined(PLATFORM_PS3) && !defined(PLATFORM_IOS)',
          )


          # POST VOID / GameMaker uses vertex_format_add_texcoord.
          # Butterscotch currently registers the implementation under
          # the misspelled name vertex_format_add_textcoord.
          replace(
              'src/vm_builtins.c',
              'VM_registerBuiltin(ctx, "vertex_format_add_textcoord", builtin_vertex_format_add_textcoord);',
              '''VM_registerBuiltin(ctx, "vertex_format_add_textcoord", builtin_vertex_format_add_textcoord);
              VM_registerBuiltin(ctx, "vertex_format_add_texcoord", builtin_vertex_format_add_textcoord);''',
          )

          # GameMaker 2023 calls this during Localization setup.
          # It only toggles font antialiasing state; returning undefined is
          # enough for POST VOID to continue on our renderer.
          replace(
              'src/vm_builtins.c',
              '// ===[ STUB LOGGING ]===',
              '''static RValue builtin_font_add_enable_aa(
                  MAYBE_UNUSED VMContext* ctx,
                  MAYBE_UNUSED RValue* args,
                  MAYBE_UNUSED int32_t argCount
              ) {
                  return RValue_makeUndefined();
              }

              // ===[ STUB LOGGING ]===''',
          )

          replace(
              'src/vm_builtins.c',
              'VM_registerBuiltin(ctx, "font_add_sprite", builtin_font_add_sprite);',
              '''VM_registerBuiltin(ctx, "font_add_enable_aa", builtin_font_add_enable_aa);
              VM_registerBuiltin(ctx, "font_add_sprite", builtin_font_add_sprite);''',
          )

          # iOS OpenGL ES accepts fwidth() in GLSL ES 1.00 only when the
          # standard-derivatives extension is enabled. POST VOID's internal
          # __yy_sdf_shader is GLSL ES 1.00 and uses fwidth().
          gl_shader_anchor = '''        char* patchedVertexSource = nullptr;
                  char* patchedFragmentSource = nullptr;
          '''

          gl_shader_replacement = '''        char* patchedVertexSource = nullptr;
                  char* patchedFragmentSource = nullptr;

          #ifdef PLATFORM_IOS
                  if (
                      modernGl->isGLES &&
                      fragmentShaderSource != nullptr &&
                      strncmp(fragmentShaderSource, "#version 100\\n", 13) == 0 &&
                      strstr(fragmentShaderSource, "fwidth") != nullptr
                  ) {
                      const char* versionLine = "#version 100\\n";
                      const char* extensionLine =
                          "#extension GL_OES_standard_derivatives : enable\\n";

                      size_t srcLen = strlen(fragmentShaderSource);
                      size_t versionLen = strlen(versionLine);
                      size_t extensionLen = strlen(extensionLine);

                      patchedFragmentSource = (char*)safeMalloc(
                          srcLen + extensionLen + 1
                      );

                      memcpy(
                          patchedFragmentSource,
                          versionLine,
                          versionLen
                      );

                      memcpy(
                          patchedFragmentSource + versionLen,
                          extensionLine,
                          extensionLen
                      );

                      memcpy(
                          patchedFragmentSource + versionLen + extensionLen,
                          fragmentShaderSource + versionLen,
                          srcLen - versionLen + 1
                      );

                      fragmentShaderSource = patchedFragmentSource;
                  }
          #endif
          '''

          replace(
              'src/gl/gl_renderer.c',
              gl_shader_anchor,
              gl_shader_replacement,
          )

          # The previous extension-based fix is not enough on Apple's GLSL
          # compiler for this exact GameMaker SDF shader. Replace ONLY the
          # internal __yy_sdf_shader fragment source with a simple compatible
          # shader. POST VOID's own gameplay shaders are left untouched.
          sdf_compile_anchor = '''        compileProgram(
                      gmlShader,
                      shdr->name,
                      vertexShaderSource,
                      fragmentShaderSource,
                      shdr->vertexAttributeCount,
                      shdr->vertexAttributes
                  );'''

          sdf_compile_replacement = r'''#ifdef PLATFORM_IOS
                  if (
                      modernGl->isGLES &&
                      strcmp(shdr->name, "__yy_sdf_shader") == 0
                  ) {
                      fragmentShaderSource =
                          "#version 100\n"
                          "precision mediump float;\n"
                          "varying vec2 v_vTexcoord;\n"
                          "varying vec4 v_vColour;\n"
                          "uniform sampler2D gm_BaseTexture;\n"
                          "void main() {\n"
                          "    vec4 texcol = texture2D(gm_BaseTexture, v_vTexcoord);\n"
                          "    float spread = 0.0035;\n"
                          "    float alpha = smoothstep(0.5 - spread, 0.5 + spread, texcol.a);\n"
                          "    gl_FragColor = vec4(v_vColour.rgb, alpha * v_vColour.a);\n"
                          "}\n";
                  }
          #endif

                  compileProgram(
                      gmlShader,
                      shdr->name,
                      vertexShaderSource,
                      fragmentShaderSource,
                      shdr->vertexAttributeCount,
                      shdr->vertexAttributes
                  );'''

          replace(
              'src/gl/gl_renderer.c',
              sdf_compile_anchor,
              sdf_compile_replacement,
          )

          # POST VOID's Android port documents the startup order as:
          # room_preload (0) -> room_splash_screen (1) ->
          # room_epilepsy (2) -> room_menu (4).
          #
          # On the iOS Butterscotch runner the game reaches room_preload but
          # never leaves it. Keep normal GML room changes, but add a timed
          # fallback only when those boot rooms are still stuck.
          boot_tail_anchor = '''    runner->frameCount++;
          }

          // ===[ Surface Stack ]==='''

          boot_tail_replacement = r'''#ifdef PLATFORM_IOS
              static int32_t iosBootLastRoom = -9999;
              static int32_t iosBootRoomFrames = 0;

              if (runner->currentRoomIndex != iosBootLastRoom) {
                  iosBootLastRoom = runner->currentRoomIndex;
                  iosBootRoomFrames = 0;
                  logInfo(
                      "iOS boot: entered room %d (%s)\n",
                      runner->currentRoomIndex,
                      runner->currentRoom != nullptr
                          ? runner->currentRoom->name
                          : "<null>"
                  );
              }

              iosBootRoomFrames++;

              if (runner->pendingRoom < 0) {
                  if (
                      runner->currentRoomIndex == 0 &&
                      iosBootRoomFrames > 10
                  ) {
                      logWarn(
                          "iOS boot fallback: room_preload stuck, advancing to room 1\n"
                      );
                      runner->pendingRoom = 1;
                  }
                  else if (
                      runner->currentRoomIndex == 1 &&
                      iosBootRoomFrames > 240
                  ) {
                      logWarn(
                          "iOS boot fallback: splash stuck, advancing to room 2\n"
                      );
                      runner->pendingRoom = 2;
                  }
                  else if (
                      runner->currentRoomIndex == 2 &&
                      iosBootRoomFrames > 240
                  ) {
                      logWarn(
                          "iOS boot fallback: epilepsy screen stuck, advancing to menu room 4\n"
                      );
                      runner->pendingRoom = 4;
                  }
              }
          #endif

              runner->frameCount++;
          }

          // ===[ Surface Stack ]==='''

          replace(
              'src/runner.c',
              boot_tail_anchor,
              boot_tail_replacement,
          )

          # ----------------------------------------------------------
          # 2. Build SDL2 inside the same Xcode project on iOS.
          # ----------------------------------------------------------
          replace(
              'CMakeLists.txt',
              '''    elseif(BACKEND STREQUAL "sdl2")
                  add_compile_definitions(USE_SDL2)

                  find_package(PkgConfig REQUIRED)
                  pkg_check_modules(SDL2 REQUIRED sdl2)
                  target_include_directories(butterscotch PRIVATE ${SDL2_INCLUDE_DIRS})
                  target_link_directories(butterscotch PRIVATE ${SDL2_LIBRARY_DIRS})
                  set(BACKEND_LIBRARIES ${SDL2_LIBRARIES})''',
              '''    elseif(BACKEND STREQUAL "sdl2")
                  add_compile_definitions(USE_SDL2)

                  if(CMAKE_SYSTEM_NAME STREQUAL "iOS")
                      set(SDL_SHARED OFF CACHE BOOL "" FORCE)
                      set(SDL_STATIC ON CACHE BOOL "" FORCE)
                      set(SDL_TEST OFF CACHE BOOL "" FORCE)
                      set(SDL_TESTS OFF CACHE BOOL "" FORCE)
                      set(SDL2_DISABLE_INSTALL ON CACHE BOOL "" FORCE)

                      add_subdirectory(vendor/SDL2 EXCLUDE_FROM_ALL)

                      set(BACKEND_LIBRARIES
                          SDL2::SDL2-static
                          SDL2::SDL2main
                      )
                  else()
                      find_package(PkgConfig REQUIRED)
                      pkg_check_modules(SDL2 REQUIRED sdl2)
                      target_include_directories(butterscotch PRIVATE ${SDL2_INCLUDE_DIRS})
                      target_link_directories(butterscotch PRIVATE ${SDL2_LIBRARY_DIRS})
                      set(BACKEND_LIBRARIES ${SDL2_LIBRARIES})
                  endif()''',
          )

          # GLAD is for desktop OpenGL. iPhone uses GLES directly.
          replace(
              'CMakeLists.txt',
              'if(NOT PLATFORM STREQUAL "vita" AND NOT PLATFORM STREQUAL "switch")\n        # GLAD',
              'if(NOT PLATFORM STREQUAL "vita" AND NOT PLATFORM STREQUAL "switch" AND NOT CMAKE_SYSTEM_NAME STREQUAL "iOS")\n        # GLAD',
          )

          # ----------------------------------------------------------
          # 3. Turn the executable into an iPhone .app bundle.
          # ----------------------------------------------------------
          replace(
              'CMakeLists.txt',
              'target_include_directories(butterscotch PRIVATE src/${PLATFORM})',
              '''target_include_directories(butterscotch PRIVATE src/${PLATFORM})

          if(CMAKE_SYSTEM_NAME STREQUAL "iOS")
              target_compile_definitions(
                  butterscotch PRIVATE
                  PLATFORM_IOS
              )
              target_sources(
                  butterscotch PRIVATE
                  src/ios/ios_overlay.m
              )


              set_target_properties(
                  butterscotch PROPERTIES
                  MACOSX_BUNDLE TRUE
                  OUTPUT_NAME "PostVoid"
                  MACOSX_BUNDLE_INFO_PLIST "${CMAKE_SOURCE_DIR}/ios/Info.plist"
                  XCODE_ATTRIBUTE_PRODUCT_BUNDLE_IDENTIFIER "com.ourports.postvoid"
                  XCODE_ATTRIBUTE_TARGETED_DEVICE_FAMILY "1"
                  XCODE_ATTRIBUTE_IPHONEOS_DEPLOYMENT_TARGET "15.0"
                  XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED "NO"
                  XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED "NO"
                  XCODE_ATTRIBUTE_ENABLE_BITCODE "NO"
                  XCODE_ATTRIBUTE_ONLY_ACTIVE_ARCH "NO"
              )

              target_link_options(
                  butterscotch PRIVATE
                  "-ObjC"
              )

              target_link_libraries(
                  butterscotch PRIVATE
                  "-framework UIKit"
                  "-framework Foundation"
                  "-framework CoreFoundation"
                  "-framework CoreGraphics"
                  "-framework QuartzCore"
                  "-framework OpenGLES"
                  "-framework CoreAudio"
                  "-framework AudioToolbox"
                  "-framework AVFoundation"
                  "-framework GameController"
                  "-framework CoreMotion"
              )
          endif()''',
          )

          # ----------------------------------------------------------
          # 4. iOS main(): load bundled game.droid and save to Documents.
          # ----------------------------------------------------------
          main_c = r'''
          #include <SDL2/SDL.h>
          #include <SDL2/SDL_main.h>
          #include <loop.h>
          #include "log.h"

          #include <stdarg.h>
          #include <limits.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/stat.h>
          #include <unistd.h>

          void platformLog(
              const logType type,
              const char *format,
              va_list va
          ) {
              FILE *out = stderr;

              switch (type) {
                  case LOG_TYPE_NORMAL:
                      out = stdout;
                      break;

                  case LOG_TYPE_WARNING:
                      fputs("Warning: ", out);
                      break;

                  case LOG_TYPE_ERROR:
                      fputs("Error: ", out);
                      break;

                  case LOG_TYPE_DEBUG:
                      fputs("Debug: ", out);
                      break;
              }

              vfprintf(out, format, va);
              fflush(out);
          }

          static void ensureDir(const char *path) {
              if (path && path[0])
                  mkdir(path, 0755);
          }

          int main(int argc, char **argv) {
              (void)argc;

              setbuf(stdout, NULL);
              setbuf(stderr, NULL);

              SDL_SetHint(SDL_HINT_TOUCH_MOUSE_EVENTS, "0");
              SDL_SetHint(SDL_HINT_MOUSE_TOUCH_EVENTS, "0");

              char *base = SDL_GetBasePath();
              if (!base)
                  return 20;

              if (chdir(base) != 0) {
                  SDL_free(base);
                  return 21;
              }

              char gamePath[PATH_MAX];
              snprintf(
                  gamePath,
                  sizeof(gamePath),
                  "%sgame.droid",
                  base
              );

              const char *home = getenv("HOME");

              char docsPath[PATH_MAX];
              char savePath[PATH_MAX];
              char logPath[PATH_MAX];

              snprintf(
                  docsPath,
                  sizeof(docsPath),
                  "%s/Documents",
                  home ? home : "."
              );

              ensureDir(docsPath);

              snprintf(
                  savePath,
                  sizeof(savePath),
                  "%s/Documents/PostVoid",
                  home ? home : "."
              );

              ensureDir(savePath);

              snprintf(
                  logPath,
                  sizeof(logPath),
                  "%s/runtime.log",
                  savePath
              );

              freopen(logPath, "a", stdout);
              freopen(logPath, "a", stderr);

              fprintf(stderr, "=== POST VOID iOS ===\n");
              fprintf(stderr, "base: %s\n", base);
              fprintf(stderr, "game: %s\n", gamePath);
              fprintf(stderr, "save: %s\n", savePath);

              if (access(gamePath, R_OK) != 0) {
                  fprintf(stderr, "ERROR: game.droid is missing\n");
                  SDL_free(base);
                  return 22;
              }

              CommandLineArgs args = {0};

              args.dataWinPath = gamePath;
              args.saveFolder = savePath;
              args.exitAtFrame = -1;

          #ifdef ENABLE_VM_TRACING
              args.traceBytecodeAfterFrame = 0;
          #endif

              args.speedMultiplier = 1.0;
              args.fastForwardSpeed = 0.0;
              args.osType = OS_ANDROID;
              args.windowWidth = 1280;
              args.windowHeight = 720;
              args.widescreenAspect = 16.0f / 9.0f;
              args.profilerFramesBetween = 0;
              /*
               * POST VOID stores absolute pointers that can jump outside
               * the currently loaded chunk. Per-chunk loading aborts on
               * those seeks, so keep the whole 225 MB game.droid mapped
               * in memory while parsing.
               */
              args.loadType =
                  DATAWINLOADTYPE_LOAD_IN_MEMORY_AHEAD_OF_TIME;

              args.lazyRooms = false;
              args.lazyTextures = false;
              args.lazyAudio = false;
              args.renderer = MODERN_GL;
              args.disableLogColours = true;
              args.alwaysLogUnknownFunctions = true;

          #ifdef ENABLE_VM_STUB_LOGS
              args.alwaysLogStubbedFunctions = true;
          #endif

              int ret = loop(args, argv[0]);

              freeCommandLineArgs(&args);

              fprintf(stderr, "runner exited: %d\n", ret);

              SDL_free(base);
              return ret;
          }
          '''

          (root / 'src/cli/main.c').write_text(
              textwrap.dedent(main_c).lstrip()
          )

          # ----------------------------------------------------------
          # 5. Invisible touch gamepad:
          #    left half = movement
          #    right half = aim
          #    bottom-right = shoot (RT)
          #    button next to it = A/action
          #    top-right = Start/pause
          # ----------------------------------------------------------
          p = root / 'src/backends/sdl2.c'
          s = p.read_text()

          init_fn_anchor = 'bool platformInit(int reqW, int reqH, const char *title, bool headless) {'
          if init_fn_anchor not in s:
              raise SystemExit('iOS overlay platformInit anchor missing')

          s = s.replace(
              init_fn_anchor,
              '''#ifdef PLATFORM_IOS
          extern void IOSOverlayInstall(void);
          #endif

          bool platformInit(int reqW, int reqH, const char *title, bool headless) {''',
              1,
          )

          platform_return_anchor = '''#endif

              return true;
          }

          void platformExit(void) {'''

          if platform_return_anchor not in s:
              raise SystemExit('iOS overlay return anchor missing')

          s = s.replace(
              platform_return_anchor,
              '''#endif

          #ifdef PLATFORM_IOS
              IOSOverlayInstall();
          #endif

              return true;
          }

          void platformExit(void) {''',
              1,
          )

          anchor = 'static SDL_GameController* openControllers[MAX_GAMEPADS];\n'
          if anchor not in s:
              raise SystemExit('Touch patch anchor 1 missing')

          touch_state = r'''

          #ifdef PLATFORM_IOS

          typedef struct {
              bool active;
              SDL_FingerID id;
              float startX;
              float startY;
              float x;
              float y;
          } IOSTouchStick;

          typedef struct {
              bool active;
              SDL_FingerID id;
          } IOSTouchButton;

          static IOSTouchStick iosLeft = {0};
          static IOSTouchStick iosRight = {0};

          static IOSTouchButton iosFire = {0};
          static IOSTouchButton iosAction = {0};
          static IOSTouchButton iosExtra = {0};
          static IOSTouchButton iosPause = {0};

          static float iosClamp(float value) {
              if (value < -1.0f) return -1.0f;
              if (value > 1.0f) return 1.0f;
              return value;
          }

          static void iosStartStick(
              IOSTouchStick *stick,
              SDL_FingerID id,
              float x,
              float y
          ) {
              stick->active = true;
              stick->id = id;
              stick->startX = x;
              stick->startY = y;
              stick->x = x;
              stick->y = y;
          }

          static void iosFingerDown(
              const SDL_TouchFingerEvent *f
          ) {
              float x = f->x;
              float y = f->y;

              if (x > 0.88f && y < 0.20f && !iosPause.active) {
                  iosPause.active = true;
                  iosPause.id = f->fingerId;
                  return;
              }

              if (x > 0.82f && y > 0.62f && !iosFire.active) {
                  iosFire.active = true;
                  iosFire.id = f->fingerId;
                  return;
              }

              if (
                  x > 0.68f && x <= 0.82f &&
                  y > 0.68f &&
                  !iosAction.active
              ) {
                  iosAction.active = true;
                  iosAction.id = f->fingerId;
                  return;
              }

              if (
                  x > 0.55f && x <= 0.68f &&
                  y > 0.72f &&
                  !iosExtra.active
              ) {
                  iosExtra.active = true;
                  iosExtra.id = f->fingerId;
                  return;
              }

              if (x < 0.46f && !iosLeft.active) {
                  iosStartStick(
                      &iosLeft,
                      f->fingerId,
                      x,
                      y
                  );
                  return;
              }

              if (!iosRight.active) {
                  iosStartStick(
                      &iosRight,
                      f->fingerId,
                      x,
                      y
                  );
              }
          }

          static void iosFingerMotion(
              const SDL_TouchFingerEvent *f
          ) {
              if (iosLeft.active && iosLeft.id == f->fingerId) {
                  iosLeft.x = f->x;
                  iosLeft.y = f->y;
              }

              if (iosRight.active && iosRight.id == f->fingerId) {
                  iosRight.x = f->x;
                  iosRight.y = f->y;
              }
          }

          static void iosFingerUp(
              const SDL_TouchFingerEvent *f
          ) {
              if (iosLeft.active && iosLeft.id == f->fingerId)
                  iosLeft.active = false;

              if (iosRight.active && iosRight.id == f->fingerId)
                  iosRight.active = false;

              if (iosFire.active && iosFire.id == f->fingerId)
                  iosFire.active = false;

              if (iosAction.active && iosAction.id == f->fingerId)
                  iosAction.active = false;

              if (iosExtra.active && iosExtra.id == f->fingerId)
                  iosExtra.active = false;

              if (iosPause.active && iosPause.id == f->fingerId)
                  iosPause.active = false;
          }

          static void iosApplyTouchGamepad(void) {
              bool hasPhysicalController = false;

              for (int i = 0; i < MAX_GAMEPADS; i++) {
                  if (
                      openControllers[i] &&
                      SDL_GameControllerGetAttached(openControllers[i])
                  ) {
                      hasPhysicalController = true;
                      break;
                  }
              }

              if (hasPhysicalController)
                  return;

              GamepadSlot *slot = &g_runner->gamepads->slots[0];

              slot->connected = true;
              slot->jid = 0;

              strncpy(
                  slot->description,
                  "POST VOID iOS Touch",
                  sizeof(slot->description) - 1
              );
              slot->description[sizeof(slot->description) - 1] = '\0';

              strncpy(
                  slot->guid,
                  "postvoid-ios-touch",
                  sizeof(slot->guid) - 1
              );
              slot->guid[sizeof(slot->guid) - 1] = '\0';

              const float radius = 0.105f;

              if (iosLeft.active) {
                  slot->axisValue[0] = iosClamp(
                      (iosLeft.x - iosLeft.startX) / radius
                  );
                  slot->axisValue[1] = iosClamp(
                      (iosLeft.y - iosLeft.startY) / radius
                  );
              }

              if (iosRight.active) {
                  slot->axisValue[2] = iosClamp(
                      (iosRight.x - iosRight.startX) / radius
                  );
                  slot->axisValue[3] = iosClamp(
                      (iosRight.y - iosRight.startY) / radius
                  );
              }

              /* A / X / RT / Start */
              slot->buttonDown[0] = iosAction.active;
              slot->buttonDown[2] = iosExtra.active;
              slot->buttonDown[7] = iosFire.active;
              slot->buttonDown[9] = iosPause.active;

              slot->buttonValue[0] = iosAction.active ? 1.0f : 0.0f;
              slot->buttonValue[2] = iosExtra.active ? 1.0f : 0.0f;
              slot->buttonValue[7] = iosFire.active ? 1.0f : 0.0f;
              slot->buttonValue[9] = iosPause.active ? 1.0f : 0.0f;

              for (int btn = 0; btn < GP_BUTTON_COUNT; btn++) {
                  bool wasDown = slot->buttonDownPrev[btn];

                  if (slot->buttonDown[btn] && !wasDown)
                      slot->buttonPressed[btn] = true;

                  if (!slot->buttonDown[btn] && wasDown)
                      slot->buttonReleased[btn] = true;
              }

              g_runner->gamepads->connectedCount = 1;
          }

          #endif
          '''

          s = s.replace(
              anchor,
              anchor + textwrap.dedent(touch_state),
              1,
          )

          event_anchor = '''            case SDL_MOUSEWHEEL:
                          if (e.wheel.y != 0)
                              RunnerMouse_onWheel(g_runner->mouse, (float)e.wheel.y);
                          break;'''

          if event_anchor not in s:
              raise SystemExit('Touch patch anchor 2 missing')

          event_replacement = event_anchor + r'''
          #ifdef PLATFORM_IOS
                      case SDL_FINGERDOWN:
                          iosFingerDown(&e.tfinger);
                          break;

                      case SDL_FINGERMOTION:
                          iosFingerMotion(&e.tfinger);
                          break;

                      case SDL_FINGERUP:
                          iosFingerUp(&e.tfinger);
                          break;
          #endif
          '''

          s = s.replace(
              event_anchor,
              event_replacement,
              1,
          )

          end_anchor = '''    }

              return false;
          #endif
          }'''

          if end_anchor not in s:
              raise SystemExit('Touch patch anchor 3 missing')

          end_replacement = '''    }

          #ifdef PLATFORM_IOS
              iosApplyTouchGamepad();
          #endif

              return false;
          #endif
          }'''

          s = s.replace(
              end_anchor,
              end_replacement,
              1,
          )

          p.write_text(s)


          # ----------------------------------------------------------
          # 6. Visible iPhone controls overlay.
          # ----------------------------------------------------------
          ios_src = root / 'src/ios'
          ios_src.mkdir(parents=True, exist_ok=True)

          overlay_m = r"""
          #import <UIKit/UIKit.h>
          #import <QuartzCore/QuartzCore.h>

          static UIImageView *PVImage(NSString *name, CGFloat size, CGFloat alpha) {
              UIImage *image = [UIImage imageNamed:name];
              UIImageView *view = [[UIImageView alloc] initWithImage:image];
              view.translatesAutoresizingMaskIntoConstraints = NO;
              view.contentMode = UIViewContentModeScaleAspectFit;
              view.alpha = alpha;
              view.userInteractionEnabled = NO;
              [NSLayoutConstraint activateConstraints:@[
                  [view.widthAnchor constraintEqualToConstant:size],
                  [view.heightAnchor constraintEqualToConstant:size]
              ]];
              return view;
          }

          static UIView *PVStickRing(CGFloat size) {
              UIView *ring = [[UIView alloc] initWithFrame:CGRectZero];
              ring.translatesAutoresizingMaskIntoConstraints = NO;
              ring.userInteractionEnabled = NO;
              ring.backgroundColor = [UIColor colorWithWhite:0.0 alpha:0.10];
              ring.layer.borderWidth = 3.0;
              ring.layer.borderColor = [UIColor colorWithWhite:1.0 alpha:0.58].CGColor;
              ring.layer.cornerRadius = size / 2.0;

              [NSLayoutConstraint activateConstraints:@[
                  [ring.widthAnchor constraintEqualToConstant:size],
                  [ring.heightAnchor constraintEqualToConstant:size]
              ]];

              UIView *dot = [[UIView alloc] initWithFrame:CGRectZero];
              dot.translatesAutoresizingMaskIntoConstraints = NO;
              dot.userInteractionEnabled = NO;
              dot.backgroundColor = [UIColor colorWithWhite:1.0 alpha:0.42];
              CGFloat dotSize = size * 0.30;
              dot.layer.cornerRadius = dotSize / 2.0;
              [ring addSubview:dot];

              [NSLayoutConstraint activateConstraints:@[
                  [dot.widthAnchor constraintEqualToConstant:dotSize],
                  [dot.heightAnchor constraintEqualToConstant:dotSize],
                  [dot.centerXAnchor constraintEqualToAnchor:ring.centerXAnchor],
                  [dot.centerYAnchor constraintEqualToAnchor:ring.centerYAnchor]
              ]];

              return ring;
          }

          void IOSOverlayInstall(void) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIApplication *app = [UIApplication sharedApplication];
                  UIWindow *window = app.keyWindow;

                  if (!window) {
                      for (UIWindow *candidate in app.windows) {
                          if (!candidate.hidden) {
                              window = candidate;
                              break;
                          }
                      }
                  }

                  if (!window) return;

                  UIView *old = [window viewWithTag:0x50564F49];
                  if (old) [old removeFromSuperview];

                  UIView *overlay = [[UIView alloc] initWithFrame:window.bounds];
                  overlay.tag = 0x50564F49;
                  overlay.backgroundColor = UIColor.clearColor;
                  overlay.userInteractionEnabled = NO;
                  overlay.autoresizingMask =
                      UIViewAutoresizingFlexibleWidth |
                      UIViewAutoresizingFlexibleHeight;

                  [window addSubview:overlay];

                  UILayoutGuide *safe = window.safeAreaLayoutGuide;

                  UIImageView *pause = PVImage(@"PV_pause", 58.0, 0.68);
                  UIImageView *fire  = PVImage(@"PV_fire", 82.0, 0.72);
                  UIImageView *jump  = PVImage(@"PV_jump", 70.0, 0.66);
                  UIImageView *extra = PVImage(@"PV_extra", 64.0, 0.62);
                  UIView *leftStick  = PVStickRing(118.0);

                  [overlay addSubview:pause];
                  [overlay addSubview:fire];
                  [overlay addSubview:jump];
                  [overlay addSubview:extra];
                  [overlay addSubview:leftStick];

                  [NSLayoutConstraint activateConstraints:@[
                      [pause.trailingAnchor constraintEqualToAnchor:safe.trailingAnchor constant:-14.0],
                      [pause.topAnchor constraintEqualToAnchor:safe.topAnchor constant:12.0],

                      [fire.trailingAnchor constraintEqualToAnchor:safe.trailingAnchor constant:-18.0],
                      [fire.bottomAnchor constraintEqualToAnchor:safe.bottomAnchor constant:-18.0],

                      [jump.trailingAnchor constraintEqualToAnchor:fire.leadingAnchor constant:-8.0],
                      [jump.bottomAnchor constraintEqualToAnchor:safe.bottomAnchor constant:-24.0],

                      [extra.trailingAnchor constraintEqualToAnchor:jump.leadingAnchor constant:-8.0],
                      [extra.bottomAnchor constraintEqualToAnchor:safe.bottomAnchor constant:-27.0],

                      [leftStick.leadingAnchor constraintEqualToAnchor:safe.leadingAnchor constant:24.0],
                      [leftStick.bottomAnchor constraintEqualToAnchor:safe.bottomAnchor constant:-20.0]
                  ]];

                  [window bringSubviewToFront:overlay];
              });
          }
          """

          (ios_src / 'ios_overlay.m').write_text(
              textwrap.dedent(overlay_m).lstrip()
          )

          # ----------------------------------------------------------
          # 6. iPhone Info.plist.
          # ----------------------------------------------------------
          ios = root / 'ios'
          ios.mkdir(exist_ok=True)

          plist = r'''<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>

              <key>CFBundleDisplayName</key>
              <string>POST VOID</string>

              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>

              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>

              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>

              <key>CFBundleName</key>
              <string>POST VOID</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>1.0</string>

              <key>CFBundleVersion</key>
              <string>1</string>

              <key>CFBundleIconFiles</key>
              <array>
                  <string>Icon-60</string>
              </array>

              <key>CFBundleIcons</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>Icon-60</string>
                      </array>
                  </dict>
              </dict>

              <key>LSRequiresIPhoneOS</key>
              <true/>

              <key>MinimumOSVersion</key>
              <string>15.0</string>

              <key>UIRequiresFullScreen</key>
              <true/>

              <key>UIStatusBarHidden</key>
              <true/>

              <key>UIViewControllerBasedStatusBarAppearance</key>
              <false/>

              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>

              <key>UISupportedInterfaceOrientations~ipad</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>

              <key>UIFileSharingEnabled</key>
              <true/>

              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>

              <key>UIApplicationSupportsIndirectInputEvents</key>
              <true/>

              <key>UILaunchScreen</key>
              <dict/>
          </dict>
          </plist>
          '''

          (ios / 'Info.plist').write_text(
              textwrap.dedent(plist).lstrip()
          )

          print('iOS runner patch complete')
          PY

      - name: Configure ARM64 iOS runner
        shell: bash
        run: |
          set -euo pipefail

          echo "EMERGENCY BUILD: using built-in silent audio backend to bypass iOS miniaudio compile failure."

          rm -rf work/build

          cmake \
            -S work/Butterscotch \
            -B work/build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DPLATFORM=cli \
            -DBACKEND=sdl2 \
            -DAUDIO_BACKEND=none \
            -DENABLE_WAD14=ON \
            -DENABLE_WAD16=ON \
            -DENABLE_WAD17=ON \
            -DENABLE_LEGACY_GL=OFF \
            -DENABLE_MODERN_GL=ON \
            -DENABLE_VM_GML_PROFILER=OFF \
            -DENABLE_VM_TRACING=OFF \
            -DENABLE_VM_OPCODE_PROFILER=OFF \
            -DENABLE_VM_STUB_LOGS=ON \
            -DENABLE_ASAN=OFF \
            2>&1 | tee logs/configure.log

      - name: Compile ARM64 iOS runner
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build work/build \
            --config Release \
            --target butterscotch \
            2>&1 | tee logs/build.log

          APP="$(
            find work/build \
              -type d \
              -name 'PostVoid.app' \
              | head -n 1
          )"

          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "ERROR: PostVoid.app was not produced."
            find work/build -maxdepth 6 -type f | sort | tail -300
            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"

          echo "Built app: $APP"
          ls -la "$APP"

          test -f "$APP/PostVoid"
          file "$APP/PostVoid"
          lipo -info "$APP/PostVoid" || true

      - name: Add complete POST VOID game data
        shell: bash
        run: |
          set -euo pipefail

          cp -R work/game/. "$APP/"

          cp work/ui/Icon-60@2x.png "$APP/Icon-60@2x.png"
          cp work/ui/Icon-60@3x.png "$APP/Icon-60@3x.png"
          cp work/ui/PV_pause.png "$APP/PV_pause.png"
          cp work/ui/PV_fire.png "$APP/PV_fire.png"
          cp work/ui/PV_jump.png "$APP/PV_jump.png"
          cp work/ui/PV_extra.png "$APP/PV_extra.png"

          test -f "$APP/Icon-60@3x.png"
          test -f "$APP/PV_pause.png"
          test -f "$APP/PV_fire.png"
          test -f "$APP/PV_jump.png"
          test -f "$APP/PV_extra.png"

          test -f "$APP/game.droid"
          test -f "$APP/options.ini"
          test -f "$APP/localization.json"
          test -f "$APP/gamecontrollerdb.txt"

          echo "Final app contents:"
          du -sh "$APP"
          ls -lh "$APP/game.droid"

      - name: Ad-hoc sign
        shell: bash
        run: |
          set -euo pipefail

          xattr -cr "$APP" || true

          codesign \
            --force \
            --sign - \
            --timestamp=none \
            "$APP"

          codesign -vv "$APP"

      - name: Build IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work/Payload
          mkdir -p work/Payload

          cp -R "$APP" work/Payload/PostVoid.app

          rm -f out/POST-VOID-iOS-v10-ANCHORFIX-ICON-BUTTONS-unsigned.ipa

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            work/Payload \
            out/POST-VOID-iOS-v10-ANCHORFIX-ICON-BUTTONS-unsigned.ipa

          test -s out/POST-VOID-iOS-v10-ANCHORFIX-ICON-BUTTONS-unsigned.ipa

          echo "IPA ready:"
          ls -lh out/POST-VOID-iOS-v10-ANCHORFIX-ICON-BUTTONS-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: POST-VOID-iOS-v10-ANCHORFIX-ICON-BUTTONS
          path: out/POST-VOID-iOS-v10-ANCHORFIX-ICON-BUTTONS-unsigned.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POST-VOID-iOS-build-logs
          path: logs/
          if-no-files-found: ignore
