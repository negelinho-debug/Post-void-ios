                      ],
                      [
                          dot.centerYAnchor
                          constraintEqualToAnchor:
                          ring.centerYAnchor
                      ]
                  ]
              ];

              return ring;
          }

          void IOSOverlayInstall(
              void
          ) {
              dispatch_async(
                  dispatch_get_main_queue(),
                  ^{
                      UIApplication *app =
                          [
                              UIApplication
                              sharedApplication
                          ];

                      UIWindow *window =
                          app.keyWindow;

                      if (!window) {
                          for (
                              UIWindow *candidate
                              in app.windows
                          ) {
                              if (
                                  !candidate.hidden
                              ) {
                                  window =
                                      candidate;

                                  break;
                              }
                          }
                      }

                      if (!window)
                          return;

                      UIView *old =
                          [
                              window
                              viewWithTag:
                              0x50564F49
                          ];

                      if (old)
                          [
                              old
                              removeFromSuperview
                          ];

                      UIView *overlay =
                          [[UIView alloc]
                              initWithFrame:
                              window.bounds];

                      overlay.tag =
                          0x50564F49;

                      overlay.backgroundColor =
                          UIColor.clearColor;

                      overlay.userInteractionEnabled =
                          NO;

                      overlay.autoresizingMask =
                          UIViewAutoresizingFlexibleWidth |
                          UIViewAutoresizingFlexibleHeight;

                      [
                          window
                          addSubview:
                          overlay
                      ];

                      UILayoutGuide *safe =
                          window.safeAreaLayoutGuide;

                      UIImageView *pause =
                          PVImage(
                              @"PV_pause",
                              58.0,
                              0.68
                          );

                      UIImageView *fire =
                          PVImage(
                              @"PV_fire",
                              82.0,
                              0.72
                          );

                      UIImageView *jump =
                          PVImage(
                              @"PV_jump",
                              70.0,
                              0.66
                          );

                      UIImageView *extra =
                          PVImage(
                              @"PV_extra",
                              64.0,
                              0.62
                          );

                      UIView *leftStick =
                          PVStickRing(
                              118.0
                          );

                      [
                          overlay
                          addSubview:
                          pause
                      ];

                      [
                          overlay
                          addSubview:
                          fire
                      ];

                      [
                          overlay
                          addSubview:
                          jump
                      ];

                      [
                          overlay
                          addSubview:
                          extra
                      ];

                      [
                          overlay
                          addSubview:
                          leftStick
                      ];

                      [
                          NSLayoutConstraint
                          activateConstraints:@[
                              [
                                  pause.trailingAnchor
                                  constraintEqualToAnchor:
                                  safe.trailingAnchor
                                  constant:-14.0
                              ],
