          touch_state = r'''

          #ifdef PLATFORM_IOS

          typedef struct {
              bool active;
              SDL_FingerID id;
              float startX;
              float startY;
              float x;
              float y;
          } IOSTouchStick;

          typedef struct {
              bool active;
              SDL_FingerID id;
          } IOSTouchButton;

          static IOSTouchStick iosLeft = {
              0
          };

          static IOSTouchStick iosRight = {
              0
          };

          static IOSTouchButton iosFire = {
              0
          };

          static IOSTouchButton iosAction = {
              0
          };

          static IOSTouchButton iosExtra = {
              0
          };

          static IOSTouchButton iosPause = {
              0
          };

          static int iosDiscoveryFrames =
              0;

          static float iosClamp(
              float value
          ) {
              if (value < -1.0f)
                  return -1.0f;

              if (value > 1.0f)
                  return 1.0f;

              return value;
          }

          static void iosStartStick(
              IOSTouchStick *stick,
              SDL_FingerID id,
              float x,
              float y
          ) {
              stick->active = true;
              stick->id = id;
              stick->startX = x;
              stick->startY = y;
              stick->x = x;
              stick->y = y;
          }

          static void iosFingerDown(
              const SDL_TouchFingerEvent *f
          ) {
              float x = f->x;
              float y = f->y;

              if (
                  x > 0.88f &&
                  y < 0.20f &&
                  !iosPause.active
              ) {
                  iosPause.active = true;
                  iosPause.id = f->fingerId;
                  return;
              }

              if (
                  x > 0.82f &&
                  y > 0.62f &&
                  !iosFire.active
              ) {
                  iosFire.active = true;
                  iosFire.id = f->fingerId;
                  return;
              }

              if (
                  x > 0.68f &&
                  x <= 0.82f &&
                  y > 0.68f &&
                  !iosAction.active
              ) {
                  iosAction.active = true;
                  iosAction.id = f->fingerId;
                  return;
              }

              if (
                  x > 0.55f &&
                  x <= 0.68f &&
                  y > 0.72f &&
                  !iosExtra.active
              ) {
                  iosExtra.active = true;
                  iosExtra.id = f->fingerId;
                  return;
              }

              if (
                  x < 0.46f &&
                  !iosLeft.active
              ) {
                  iosStartStick(
                      &iosLeft,
                      f->fingerId,
                      x,
                      y
                  );

                  return;
              }

              if (!iosRight.active) {
                  iosStartStick(
                      &iosRight,
                      f->fingerId,
                      x,
                      y
                  );
              }
          }

          static void iosFingerMotion(
              const SDL_TouchFingerEvent *f
          ) {
              if (
                  iosLeft.active &&
                  iosLeft.id ==
                  f->fingerId
              ) {
                  iosLeft.x = f->x;
                  iosLeft.y = f->y;
              }

              if (
                  iosRight.active &&
                  iosRight.id ==
                  f->fingerId
              ) {
                  iosRight.x = f->x;
                  iosRight.y = f->y;
              }
          }

          static void iosFingerUp(
              const SDL_TouchFingerEvent *f
          ) {
              if (
                  iosLeft.active &&
                  iosLeft.id ==
                  f->fingerId
              )
                  iosLeft.active =
                      false;

              if (
                  iosRight.active &&
                  iosRight.id ==
                  f->fingerId
              )
                  iosRight.active =
                      false;

              if (
                  iosFire.active &&
                  iosFire.id ==
                  f->fingerId
              )
                  iosFire.active =
                      false;

              if (
                  iosAction.active &&
                  iosAction.id ==
                  f->fingerId
              )
                  iosAction.active =
                      false;

              if (
                  iosExtra.active &&
                  iosExtra.id ==
                  f->fingerId
              )
                  iosExtra.active =
                      false;

              if (
                  iosPause.active &&
                  iosPause.id ==
                  f->fingerId
              )
                  iosPause.active =
                      false;
          }

          static void iosApplyTouchGamepad(
              void
          ) {
              bool hasPhysicalController =
                  false;

              for (
                  int i = 0;
                  i < MAX_GAMEPADS;
                  i++
              ) {
                  if (
                      openControllers[i] &&
                      SDL_GameControllerGetAttached(
                          openControllers[i]
                      )
                  ) {
                      hasPhysicalController =
                          true;

                      break;
                  }
              }

              if (
                  hasPhysicalController
              )
                  return;

              GamepadSlot *slot =
                  &g_runner
                      ->gamepads
                      ->slots[0];

              slot->connected =
                  true;

              slot->jid =
                  0;

              strncpy(
                  slot->description,
                  "XInput STANDARD GAMEPAD",
                  sizeof(
                      slot->description
                  ) - 1
              );

              slot->description[
                  sizeof(
                      slot->description
                  ) - 1
              ] = '\0';

              strncpy(
                  slot->guid,
                  "postvoid-ios-touch",
                  sizeof(
                      slot->guid
                  ) - 1
              );

              slot->guid[
                  sizeof(
                      slot->guid
                  ) - 1
              ] = '\0';

              const float radius =
                  0.105f;

              if (iosLeft.active) {
                  slot->axisValue[0] =
                      iosClamp(
                          (
                              iosLeft.x -
                              iosLeft.startX
                          ) /
                          radius
                      );

                  slot->axisValue[1] =
                      iosClamp(
                          (
                              iosLeft.y -
                              iosLeft.startY
                          ) /
                          radius
                      );
              }

              if (iosRight.active) {
                  slot->axisValue[2] =
                      iosClamp(
                          (
                              iosRight.x -
                              iosRight.startX
                          ) /
                          radius
                      );

                  slot->axisValue[3] =
                      iosClamp(
                          (
                              iosRight.y -
                              iosRight.startY
                          ) /
                          radius
                      );
              }

              slot->buttonDown[0] =
                  iosAction.active;

              slot->buttonDown[2] =
                  iosExtra.active;

              slot->buttonDown[7] =
                  iosFire.active;

              slot->buttonDown[9] =
                  iosPause.active;

              slot->buttonValue[0] =
                  iosAction.active
                      ? 1.0f
                      : 0.0f;

              slot->buttonValue[2] =
                  iosExtra.active
                      ? 1.0f
                      : 0.0f;

              slot->buttonValue[7] =
                  iosFire.active
                      ? 1.0f
                      : 0.0f;

              slot->buttonValue[9] =
                  iosPause.active
                      ? 1.0f
                      : 0.0f;

              for (
                  int btn = 0;
                  btn < GP_BUTTON_COUNT;
                  btn++
              ) {
                  bool wasDown =
                      slot
                          ->buttonDownPrev[
                              btn
                          ];

                  if (
                      slot
                          ->buttonDown[
                              btn
                          ] &&
                      !wasDown
                  )
                      slot
                          ->buttonPressed[
                              btn
                          ] =
                          true;

                  if (
                      !slot
                          ->buttonDown[
                              btn
                          ] &&
                      wasDown
                  )
                      slot
                          ->buttonReleased[
                              btn
                          ] =
                          true;
              }

              if (
                  iosDiscoveryFrames <
                  240
              ) {
                  slot->connectedPrev =
                      false;

                  iosDiscoveryFrames++;
              }

              g_runner
                  ->gamepads
                  ->connectedCount =
                  1;
          }

          #endif
          '''

